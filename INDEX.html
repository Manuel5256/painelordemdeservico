<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  
  <title>TOTAL · Central de O.S.</title>
  <meta name="description" content="Sistema de monitoramento e ordens de serviço TOTAL">
  <meta name="theme-color" content="#ffcc00">
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* FUNDO DO SITE NA COR DA LOGO */
    body {
      background: #ffcc00; /* Amarelo Ouro da Logo */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    #app {
      width: 100%;
      max-width: 1300px;
      background: #111111; /* Fundo escuro para dar contraste na caixa principal */
      border-radius: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8), 0 0 0 2px #ffcc00;
      padding: 1.8rem 1.5rem;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      width: 100%;
    }

    .screen.active {
      display: flex;
    }

    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
    }

    /* LOGO DA EMPRESA */
    .logo-img {
      max-width: 350px;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 0 20px rgba(255, 204, 0, 0.4));
      margin-bottom: 0.5rem;
    }

    .system-name {
      color: #ffcc00;
      font-weight: 400;
      font-size: 1.8rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-top: 0.5rem;
      border-top: 1px solid #ffcc00;
      padding-top: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      justify-content: center;
    }

    /* BOTÕES PRETOS COM TEXTO AMARELO (Invertido da Logo) */
    .btn {
      background: #111111;
      border: 2px solid #ffcc00;
      color: #ffcc00;
      font-weight: bold;
      padding: 0.9rem 2.2rem;
      border-radius: 3rem;
      font-size: 1.2rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transition: all 0.2s;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    }

    .btn:hover {
      background: #222;
      color: #fff;
      transform: translateY(-1px);
    }

    .btn-sm {
      padding: 0.5rem 1.2rem;
      font-size: 0.9rem;
    }

    .btn-outline {
      background: transparent;
      color: #ffcc00;
      border: 1.5px solid #ffcc00;
      box-shadow: none;
    }

    .btn-outline:hover {
      background: #222;
    }

    .btn-outline-sm {
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      background: transparent;
      color: #ffcc00;
      border: 1.5px solid #ffcc00;
      box-shadow: none;
      border-radius: 2rem;
      cursor: pointer;
    }

    /* CARDS BRANCOS COM BORDAS AMARELAS */
    .card {
      background: #ffffff;
      border-radius: 1.8rem;
      padding: 1.8rem;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      border: 1px solid #ffcc00;
      width: 100%;
    }

    .dashboard-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }

    .stat-card {
      background: #ffffff;
      border-left: 6px solid #ffcc00;
      border-radius: 1.2rem;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      color: #111;
      min-width: 150px;
      flex: 1 1 180px;
      transition: all 0.3s;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .stat-card:hover {
      background: #f8f8f8;
      border-left-color: #d4a800;
    }

    /* INPUTS PRETOS COM TEXTO AMARELO */
    input, select, textarea {
      background: #111;
      border: 1px solid #ffcc00;
      border-radius: 1rem;
      padding: 0.9rem 1.2rem;
      color: #ffcc00;
      font-size: 1rem;
      outline: none;
      width: 100%;
      margin-top: 0.5rem;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #fff;
      box-shadow: 0 0 8px rgba(255, 204, 0, 0.6);
    }

    .flex-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
    }

    .table-responsive {
      overflow-x: auto;
      border-radius: 1.2rem;
      margin-top: 1rem;
    }

    .badge {
      background: #ffcc00;
      color: #000;
      padding: 0.2rem 0.7rem;
      border-radius: 2rem;
      font-weight: bold;
      font-size: 0.8rem;
    }

    .badge-status {
      padding: 0.3rem 0.8rem;
      border-radius: 2rem;
      font-weight: bold;
      font-size: 0.85rem;
      border: 1px solid #111;
    }

    .badge-aberta { background: #ff6600; color: white; }
    .badge-andamento { background: #0066ff; color: white; }
    .badge-pendente { background: #ffcc00; color: black; }
    .badge-finalizada { background: #00cc66; color: white; }

    .timeline {
      background: #f5f5f5;
      border-radius: 1rem;
      padding: 1rem;
      margin-top: 0.8rem;
      font-size: 0.9rem;
      color: #333;
      max-height: 150px;
      overflow-y: auto;
      border-left: 3px solid #ffcc00;
    }

    .hidden {
      display: none !important;
    }

    .loading {
      color: #ffcc00;
      text-align: center;
      padding: 2rem;
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .tab {
      padding: 0.5rem 1.2rem;
      border-radius: 2rem;
      cursor: pointer;
      background: #111;
      color: #ffcc00;
      border: 1px solid #ffcc00;
      transition: all 0.2s;
      font-size: 0.9rem;
    }

    .tab.active {
      background: #ffcc00;
      color: #000;
      border-color: #ffcc00;
      font-weight: bold;
    }

    .tab:hover:not(.active) {
      border-color: #fff;
      color: #fff;
    }

    .highlight-card {
      border: 2px solid #ffcc00;
      background: #f8f8f8;
    }

    .master-badge {
      background: #ff0000;
      color: white;
      padding: 0.2rem 0.7rem;
      border-radius: 2rem;
      font-weight: bold;
      font-size: 0.7rem;
      margin-left: 0.5rem;
    }

    /* Cores do texto */
    .cliente-branco, .codmoni-branco {
      color: #111;
    }
    h3, h4, h5, strong {
      color: #111 !important;
    }

    .btn-excluir-dourado {
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      background: transparent;
      color: #ffcc00;
      border: 1.5px solid #ffcc00;
      box-shadow: none;
      border-radius: 2rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-excluir-dourado:hover {
      background: #ffcc00;
      color: #000;
    }

    #installContainer {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999;
    }
    #installBtn {
      background: #111;
      color: #ffcc00;
      border: 2px solid #ffcc00;
      border-radius: 50px;
      padding: 12px 20px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(255, 204, 0, 0.6);
      cursor: pointer;
    }
    #installBtn:hover {
      background: #ffcc00;
      color: #111;
    }

    @media (max-width: 600px) {
      #app { 
        padding: 1rem; 
        border-radius: 1.5rem;
      }
      .logo-img {
        max-width: 250px;
      }
      .btn {
        padding: 0.7rem 1.5rem;
        font-size: 1rem;
      }
      .stat-card {
        min-width: 130px;
        flex: 1 1 130px;
      }
      #installContainer {
        bottom: 10px;
        right: 10px;
      }
      #installBtn {
        padding: 10px 15px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
<div id="app">
  <!-- TELA INICIAL -->
  <div id="homeScreen" class="screen active">
    <div class="logo-area">
      <img src="logo.png" alt="Logo TOTAL Monitoramento" class="logo-img" onerror="this.style.display='none'; document.getElementById('fallbackLogo').style.display='flex';">
      <div id="fallbackLogo" class="logo-icon" style="display:none; background:#ffcc00; color:#000; font-size:3.8rem; font-weight:800; padding:0.5rem 2rem; border-radius:3rem; letter-spacing:2px; align-items:center; gap:0.5rem; box-shadow:0 0 25px #ffcc00;">
        <i class="fas fa-shield-alt"></i> TOTAL
      </div>
      <div class="system-name">
        <i class="fas fa-broadcast-tower" style="color:#ffcc00;"></i> MONITORAMENTO
      </div>
    </div>
    <div class="btn-group">
      <button class="btn" id="btnEntrar"><i class="fas fa-sign-in-alt"></i> Entrar</button>
    </div>
    <div id="loginFormArea" class="card hidden" style="max-width: 400px;">
      <h3 style="color:#000; margin-bottom:1rem;"><i class="fas fa-lock"></i> Login</h3>
      <input type="text" id="loginUser" placeholder="Usuário" autocomplete="off">
      <input type="password" id="loginPass" placeholder="Senha">
      <button class="btn" id="btnLoginExec" style="width:100%; margin-top:1rem;">Acessar Sistema</button>
    </div>
  </div>

  <!-- PAINEL PRINCIPAL -->
  <div id="panelScreen" class="screen">
    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; flex-wrap: wrap; gap: 1rem;">
      <div style="display: flex; align-items: center; gap: 1rem;">
        <img src="logo.png" alt="TOTAL" style="height: 45px; border-radius: 8px; background:#111; padding: 2px;" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="logo-icon" style="display:none; background:#ffcc00; color:#000; font-size:1.6rem; font-weight:800; padding:0.3rem 1.2rem; border-radius:2rem;">TOTAL</div>
        <span style="color:#ffcc00; font-size:0.9rem;"><i class="fas fa-circle" style="color:#00ff00; font-size:0.6rem;"></i> Online</span>
      </div>
      <div style="color:#fff; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
        <span id="userDisplay" style="color:#ffcc00;"></span>
        <button class="btn-outline" id="btnLogout" style="padding:0.4rem 1rem;"><i class="fas fa-sign-out-alt"></i> Sair</button>
      </div>
    </div>
    
    <!-- Dashboard cards -->
    <div id="dashboardArea" class="dashboard-cards"></div>
    
    <!-- Área específica por perfil -->
    <div id="profileContent" class="card" style="margin-top:0.5rem;">
      <div class="loading"><i class="fas fa-spinner fa-spin"></i> Carregando...</div>
    </div>
  </div>
</div>

<div id="installContainer">
  <button id="installBtn"><i class="fas fa-download"></i> Instalar App</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
  import { getDatabase, ref, set, get, update, push, onValue, off, remove } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDpx8nx2aEzlePKcw7HPmKsAEXBmasmSbM",
    authDomain: "painel-7e84e.firebaseapp.com",
    databaseURL: "https://painel-7e84e-default-rtdb.firebaseio.com",
    projectId: "painel-7e84e",
    storageBucket: "painel-7e84e.firebasestorage.app",
    messagingSenderId: "1083755674443",
    appId: "1:1083755674443:web:83cb1a78853141a45086ce"
  };

  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);

  const usersRef = ref(database, 'users');
  const ordensRef = ref(database, 'ordens');
  const configRef = ref(database, 'config');

  let currentUser = null;
  let ordensListener = null;
  let abaAtual = 'todas';

  const homeScreen = document.getElementById('homeScreen');
  const panelScreen = document.getElementById('panelScreen');
  const loginFormArea = document.getElementById('loginFormArea');
  const profileContent = document.getElementById('profileContent');
  const dashboardArea = document.getElementById('dashboardArea');

  function getNow() {
    const d = new Date();
    return { 
      data: d.toLocaleDateString('pt-BR'), 
      hora: d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) 
    };
  }

  async function getNextProtocolo() {
    const snapshot = await get(configRef);
    let config = snapshot.val() || {};
    if (!config.nextProtocolo) {
      config.nextProtocolo = 458921;
      await set(configRef, config);
    }
    const next = config.nextProtocolo;
    await update(configRef, { nextProtocolo: next + 1 });
    return next;
  }

  function getStatusBadgeClass(status) {
    switch(status) {
      case 'ABERTA': return 'badge-aberta';
      case 'EM ANDAMENTO': return 'badge-andamento';
      case 'PENDENTE': return 'badge-pendente';
      case 'FINALIZADA': return 'badge-finalizada';
      default: return '';
    }
  }

  function isMaster() {
    return currentUser && currentUser.isMaster === true;
  }

  function salvarSessao(user) {
    try {
      localStorage.setItem('total_user_session', JSON.stringify(user));
    } catch (e) {
      console.error('Erro ao salvar sessão:', e);
    }
  }

  function removerSessao() {
    try {
      localStorage.removeItem('total_user_session');
    } catch (e) {
      console.error('Erro ao remover sessão:', e);
    }
  }

  function recuperarSessao() {
    try {
      const data = localStorage.getItem('total_user_session');
      if (data) {
        return JSON.parse(data);
      }
    } catch (e) {
      console.error('Erro ao recuperar sessão:', e);
    }
    return null;
  }

  document.getElementById('btnEntrar').addEventListener('click', () => {
    loginFormArea.classList.toggle('hidden');
  });

  document.getElementById('btnLoginExec').addEventListener('click', async () => {
    const usuario = document.getElementById('loginUser').value.trim();
    const senha = document.getElementById('loginPass').value.trim();
    
    if (!usuario || !senha) {
      alert('Preencha usuário e senha!');
      return;
    }
    
    try {
      const snapshot = await get(usersRef);
      const users = snapshot.val() || {};
      
      let found = null;
      
      if (usuario === 'IRLAN' && senha === '4747') {
        found = { 
          usuario: 'IRLAN', 
          senha: '4747', 
          funcao: 'Gestor', 
          isMaster: true 
        };
      } else {
        found = Object.values(users).find(u => u.usuario === usuario && u.senha === senha);
      }
      
      if (!found) {
        alert('Credenciais inválidas!');
        return;
      }
      
      salvarSessao(found);
      await entrarNoSistema(found);
      
    } catch (error) {
      alert('Erro ao fazer login. Verifique a conexão.');
      console.error(error);
    }
  });

  async function entrarNoSistema(user) {
    currentUser = user;
    abaAtual = 'todas';
    
    let userDisplay = document.getElementById('userDisplay');
    userDisplay.innerHTML = `
      <i class="fas fa-user-circle"></i> ${user.usuario} 
      <span class="badge">${user.funcao}</span>
      ${user.isMaster ? '<span class="master-badge"><i class="fas fa-crown"></i> MASTER</span>' : ''}
    `;
    
    homeScreen.classList.remove('active');
    panelScreen.classList.add('active');
    loginFormArea.classList.add('hidden');
    
    document.getElementById('loginUser').value = '';
    document.getElementById('loginPass').value = '';
    
    await renderPanel();
  }

  document.getElementById('btnLogout').addEventListener('click', () => {
    if (ordensListener) {
      off(ordensRef, 'value', ordensListener);
      ordensListener = null;
    }
    currentUser = null;
    abaAtual = 'todas';
    removerSessao();
    panelScreen.classList.remove('active');
    homeScreen.classList.add('active');
  });

  function atualizarDashboard(ordens) {
    const abertas = ordens.filter(o => o.status === 'ABERTA').length;
    const andamento = ordens.filter(o => o.status === 'EM ANDAMENTO').length;
    const pendentes = ordens.filter(o => o.status === 'PENDENTE').length;
    const finalizadas = ordens.filter(o => o.status === 'FINALIZADA').length;
    const tecnicosUnicos = [...new Set(ordens.filter(o => o.tecnico && o.status === 'EM ANDAMENTO').map(o => o.tecnico))];
    const tecEmAtend = tecnicosUnicos.length;
    
    let minhasOS = [];
    if (currentUser) {
      if (currentUser.funcao === 'Operador') {
        minhasOS = ordens.filter(o => o.operador === currentUser.usuario && o.status !== 'FINALIZADA');
      } else if (currentUser.funcao === 'Tecnico') {
        minhasOS = ordens.filter(o => o.tecnico === currentUser.usuario && o.status !== 'FINALIZADA');
      } else if (currentUser.funcao === 'Gestor' || isMaster()) {
        minhasOS = ordens.filter(o => o.status !== 'FINALIZADA');
      }
    }
    
    dashboardArea.innerHTML = `
      <div class="stat-card">
        <i class="fas fa-folder-open" style="color:#ffcc00; font-size:1.5rem;"></i> 
        <div>
          <small style="color:#666;">Abertas</small>
          <br><strong style="font-size:1.3rem;">${abertas}</strong>
        </div>
      </div>
      <div class="stat-card">
        <i class="fas fa-play-circle" style="color:#ff9900; font-size:1.5rem;"></i> 
        <div>
          <small style="color:#666;">Em Andamento</small>
          <br><strong style="font-size:1.3rem;">${andamento}</strong>
        </div>
      </div>
      <div class="stat-card">
        <i class="fas fa-pause-circle" style="color:#ffcc00; font-size:1.5rem;"></i> 
        <div>
          <small style="color:#666;">Pendentes</small>
          <br><strong style="font-size:1.3rem;">${pendentes}</strong>
        </div>
      </div>
      <div class="stat-card">
        <i class="fas fa-check-circle" style="color:#00cc66; font-size:1.5rem;"></i> 
        <div>
          <small style="color:#666;">Finalizadas</small>
          <br><strong style="font-size:1.3rem;">${finalizadas}</strong>
        </div>
      </div>
      <div class="stat-card">
        <i class="fas fa-user-cog" style="color:#3399ff; font-size:1.5rem;"></i> 
        <div>
          <small style="color:#666;">Téc. Atend.</small>
          <br><strong style="font-size:1.3rem;">${tecEmAtend}</strong>
        </div>
      </div>
      <div class="stat-card highlight-card">
        <i class="fas fa-star" style="color:#ffcc00; font-size:1.5rem;"></i> 
        <div>
          <small style="color:#666;">Minhas O.S.</small>
          <br><strong style="font-size:1.3rem; color:#000;">${minhasOS.length}</strong>
        </div>
      </div>
    `;
  }

  async function renderPanel() {
    if (!currentUser) return;
    
    profileContent.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Carregando dados...</div>';
    
    if (ordensListener) {
      off(ordensRef, 'value', ordensListener);
    }
    
    ordensListener = onValue(ordensRef, (snapshot) => {
      const ordensData = snapshot.val() || {};
      const ordensList = Object.entries(ordensData).map(([key, value]) => ({
        id: key,
        ...value
      }));
      
      atualizarDashboard(ordensList);
      
      if (isMaster()) renderGestor(ordensList, true);
      else if (currentUser.funcao === 'Operador') renderOperador(ordensList);
      else if (currentUser.funcao === 'Gestor') renderGestor(ordensList, false);
      else if (currentUser.funcao === 'Tecnico') renderTecnico(ordensList);
    });
  }

  async function addTimeline(ordemId, texto) {
    const ordemRef = ref(database, `ordens/${ordemId}/timeline`);
    const snapshot = await get(ordemRef);
    const timeline = snapshot.val() || [];
    timeline.push({ hora: getNow().hora, texto });
    await set(ordemRef, timeline);
  }

  function renderOperador(ordens) {
    const user = currentUser;
    const minhasOS = ordens.filter(o => o.operador === user.usuario);
    
    profileContent.innerHTML = `
      <h3 style="color:#000; margin-bottom:1rem;">
        <i class="fas fa-user-shield"></i> Painel Operador · Turno ${user.turno || 'N/A'}
      </h3>
      
      <div class="flex-row" style="margin-bottom:1rem;">
        <input type="text" id="codMoniInput" placeholder="Digite o Código MONI" style="flex:2;">
        <button class="btn" id="btnBuscarMoni" style="flex:1;">
          <i class="fas fa-search"></i> Verificar / Abrir O.S.
        </button>
      </div>
      
      <div id="novaOsForm" class="hidden"></div>
      <div id="osExistenteMsg" class="hidden"></div>
      
      <div class="tabs">
        <div class="tab ${abaAtual === 'todas' ? 'active' : ''}" data-tab="todas">
          <i class="fas fa-list"></i> Todas
        </div>
        <div class="tab ${abaAtual === 'minhas' ? 'active' : ''}" data-tab="minhas">
          <i class="fas fa-star"></i> Minhas O.S. (${minhasOS.length})
        </div>
        <div class="tab ${abaAtual === 'abertas' ? 'active' : ''}" data-tab="abertas">
          <i class="fas fa-folder-open"></i> Abertas
        </div>
        <div class="tab ${abaAtual === 'andamento' ? 'active' : ''}" data-tab="andamento">
          <i class="fas fa-play"></i> Em Andamento
        </div>
        <div class="tab ${abaAtual === 'pendentes' ? 'active' : ''}" data-tab="pendentes">
          <i class="fas fa-pause"></i> Pendentes
        </div>
        <div class="tab ${abaAtual === 'finalizadas' ? 'active' : ''}" data-tab="finalizadas">

  async function buscarOuAbrirOS(ordens) {
    const cod = document.getElementById('codMoniInput').value.trim();
    if (!cod) return alert('Informe o código MONI');
    
    const existente = ordens.find(o => o.codMoni === cod && o.status !== 'FINALIZADA');
    const novaDiv = document.getElementById('novaOsForm');
    const msgDiv = document.getElementById('osExistenteMsg');
    
    if (existente) {
      msgDiv.classList.remove('hidden');
      msgDiv.innerHTML = `
        <div class="card" style="background:#fafafa; border: 2px solid #ffcc00;">
          <i class="fas fa-exclamation-triangle" style="color:#ffcc00;"></i>
          <strong style="color:#000;">Já existe O.S. aberta para este Código MONI</strong><br>
          <span style="color:#333;">
            Protocolo: <strong>${existente.protocolo}</strong> | 
            Operador: ${existente.operador}<br>
            Data: ${existente.dataAbertura} | Hora: ${existente.horaAbertura}<br>
            Status: <span class="badge-status ${getStatusBadgeClass(existente.status)}">${existente.status}</span>
          </span>
          <br>
          <button class="btn" id="btnCancelarExistente" style="margin-top:0.5rem;">Cancelar</button>
        </div>`;
      
      document.getElementById('btnCancelarExistente').addEventListener('click', () => {
        msgDiv.classList.add('hidden');
      });
      novaDiv.classList.add('hidden');
    } else {
      msgDiv.classList.add('hidden');
      novaDiv.classList.remove('hidden');
      novaDiv.innerHTML = `
        <div class="card" style="border: 2px solid #ffcc00;">
          <h4 style="color:#000;"><i class="fas fa-plus-circle"></i> Nova Ordem de Serviço</h4>
          <input type="text" id="nomeCliente" placeholder="Nome do Cliente">
          <textarea id="obsAbertura" placeholder="Observação" rows="3"></textarea>
          <button class="btn" id="btnSalvarOS" style="margin-top:0.5rem;">
            <i class="fas fa-save"></i> Salvar O.S.
          </button>
        </div>`;
      
      document.getElementById('btnSalvarOS').addEventListener('click', async () => {
        const cliente = document.getElementById('nomeCliente').value.trim();
        const obs = document.getElementById('obsAbertura').value.trim();
        
        if (!cliente) {
          alert('Nome do cliente é obrigatório!');
          return;
        }
        
        try {
          const protocolo = await getNextProtocolo();
          const { data, hora } = getNow();
          
          const novaOS = {
            protocolo,
            codMoni: cod,
            cliente,
            observacao: obs,
            operador: currentUser.usuario,
            dataAbertura: data,
            horaAbertura: hora,
            status: 'ABERTA',
            prioridade: null,
            tecnico: null,
            timeline: [{
              hora: hora,
              texto: `Operador ${currentUser.usuario} abriu a O.S.`
            }]
          };
          
          await push(ordensRef, novaOS);
          novaDiv.classList.add('hidden');
          document.getElementById('codMoniInput').value = '';
          
        } catch (error) {
          alert('Erro ao salvar O.S. Tente novamente.');
          console.error(error);
        }
      });
    }
  }

  async function definirPrioridade(ordens) {
    const checks = [...document.querySelectorAll('.check-os:checked')].map(c => c.value);
    if (!checks.length) return alert('Selecione pelo menos uma O.S.');
    
    const prior = prompt('Prioridade:\n1 - Urgente\n2 - Alta\n3 - Normal\n4 - Baixa');
    if (!prior || !['1','2','3','4'].includes(prior)) return;
    
    const priorMap = {
      '1': '🔴 Prioridade 1 (Urgente)',
      '2': '🟠 Prioridade 2 (Alta)',
      '3': '🟡 Prioridade 3 (Normal)',
      '4': '🔵 Prioridade 4 (Baixa)'
    };
    
    try {
      for (const osId of checks) {
        await update(ref(database, `ordens/${osId}`), { prioridade: priorMap[prior] });
        await addTimeline(osId, `Gestor definiu ${priorMap[prior]}`);
      }
      alert('Prioridades definidas com sucesso!');
    } catch (error) {
      alert('Erro ao definir prioridades');
      console.error(error);

  }

          <div class="timeline" style="margin-top:0.8rem;">
            <strong style="color:#000;"><i class="fas fa-history"></i> Últimas ações:</strong>
            ${o.timeline.slice(-3).map(t => `
              <div style="margin-top:0.3rem;">🕐 ${t.hora} - ${t.texto}</div>
            `).join('')}
          </div>
        ` : ''}
      </div>
    `).join('');
  }

  window.assumirOS = async function(osId) {
    try {
      const snapshot = await get(ref(database, `ordens/${osId}`));
      const os = snapshot.val();
      
      if (os.tecnico && os.tecnico !== currentUser.usuario) {
        alert('Esta O.S. já está com outro técnico!');
        return;
      }
      
      await update(ref(database, `ordens/${osId}`), {
        tecnico: currentUser.usuario,
        status: 'EM ANDAMENTO'
      });
      
      await addTimeline(osId, `Técnico ${currentUser.usuario} assumiu o atendimento`);
      await addTimeline(osId, 'Atendimento iniciado');
      
    } catch (error) {
      alert('Erro ao assumir O.S.');
      console.error(error);
    }
  };

  window.pendenteOS = async function(osId) {
    const motivo = prompt('Motivo da pendência:');
    if (!motivo) return;
    
    try {
      await update(ref(database, `ordens/${osId}`), { status: 'PENDENTE' });
      await addTimeline(osId, `Status alterado para PENDENTE. Motivo: ${motivo}`);
    } catch (error) {
      alert('Erro ao pausar O.S.');
      console.error(error);
    }
  };

  window.finalizarOS = async function(osId) {
    try {
      const snapshot = await get(ref(database, `ordens/${osId}`));
      const os = snapshot.val();
      
      const confirma = confirm(
        '⚠️ ATENÇÃO TÉCNICO:\n\n' +
        'Para finalizar esta O.S., você precisa do número do protocolo.\n\n' +
        'Entre em contato com a CENTRAL para obter esta informação.\n\n' +
        'Deseja continuar com a finalização?'
      );
      
      if (!confirma) return;
      
      const protocoloInformado = prompt(
        'Digite o número do protocolo fornecido pela CENTRAL:'
      );
      
      if (!protocoloInformado) {
        alert('Operação cancelada. Você precisa do número do protocolo para finalizar.');
        return;
      }
      
      if (protocoloInformado != os.protocolo) {
        alert('❌ Número de protocolo incorreto!\n\nEntre em contato com a CENTRAL para confirmar o número correto.');
        return;
      }
      
      const materiais = prompt('Materiais utilizados:');
      const obsFinais = prompt('Observações finais:');
      
      await update(ref(database, `ordens/${osId}`), {
        status: 'FINALIZADA',
        materiaisUtilizados: materiais || 'Não informado',
        observacoesFinais: obsFinais || 'Não informado'
      });
      
      await addTimeline(osId, `Materiais utilizados: ${materiais || 'N/A'}`);
      await addTimeline(osId, `O.S. Finalizada. ${obsFinais || ''}`);
      
      alert('✅ O.S. finalizada com sucesso!');
      
    } catch (error) {
      alert('Erro ao finalizar O.S.');
      console.error(error);
    }
  };

  async function restaurarSessao() {
    const sessao = recuperarSessao();
    
    if (sessao) {
      console.log('🔄 Sessão encontrada, restaurando...');
      
      if (sessao.isMaster) {
        await entrarNoSistema(sessao);
        return;
      }
      
      try {
        const snapshot = await get(usersRef);
        const users = snapshot.val() || {};
        const userExists = Object.values(users).some(u => u.usuario === sessao.usuario);
        
        if (userExists) {
          await entrarNoSistema(sessao);
          return;
        } else {
          removerSessao();
          console.log('⚠️ Usuário não existe mais, sessão removida');
        }
      } catch (error) {
        console.error('Erro ao verificar usuário:', error);
        removerSessao();
      }
    }
    
    homeScreen.classList.add('active');
    panelScreen.classList.remove('active');
  }

  window.addEventListener('load', async () => {
    await restaurarSessao();
  });

  let deferredPrompt;
  const installContainer = document.getElementById('installContainer');
  const installBtn = document.getElementById('installBtn');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installContainer.style.display = 'block';
    
    installBtn.addEventListener('click', async () => {
      installContainer.style.display = 'none';
      deferredPrompt.prompt();
      const result = await deferredPrompt.userChoice;
      if (result.outcome === 'accepted') {
        console.log('App instalado com sucesso!');
      } else {
        console.log('Instalação cancelada pelo usuário.');
      }
      deferredPrompt = null;
    });
  });

  window.addEventListener('appinstalled', () => {
    installContainer.style.display = 'none';
    console.log('App instalado com sucesso.');
  });
</script>
</body>
</html>
