<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  
  <title>TOTAL · Central de O.S.</title>
  <meta name="description" content="Sistema de monitoramento e ordens de serviço TOTAL">
  <meta name="theme-color" content="#ffcc00">
  
  <!-- PWA - Manifest via JavaScript -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Ícones -->
  <link rel="icon" type="image/png" sizes="192x192" href="logo.png">
  <link rel="icon" type="image/png" sizes="512x512" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="apple-touch-icon" sizes="192x192" href="logo.png">
  <link rel="apple-touch-icon" sizes="512x512" href="logo.png">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    /* ==================== RESET E BASE ==================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    }

    html, body {
      height: 100%;
      width: 100%;
      background: #0d0d0d;
      color: #fff;
      overflow: hidden;
      font-size: 18px;
    }

    /* ==================== APP CONTAINER ==================== */
    #app {
      width: 100%;
      height: 100vh;
      max-width: 1400px;
      margin: 0 auto;
      padding: 12px 12px 0 12px;
      display: flex;
      flex-direction: column;
      background: linear-gradient(145deg, #0d0d0d 0%, #1a1a1a 100%);
      overflow: hidden;
    }

    /* ==================== TELAS ==================== */
    .screen {
      display: none;
      flex-direction: column;
      width: 100%;
      height: 100%;
      animation: fadeIn 0.4s ease;
      overflow: hidden;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==================== TELA DE LOGIN CENTRALIZADA ==================== */
    #homeScreen {
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 10px 0;
    }

    .login-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .login-logo img {
      max-width: 350px;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 4px 30px rgba(255, 204, 0, 0.2));
      transition: all 0.3s ease;
    }

    .login-logo img:hover {
      filter: drop-shadow(0 4px 40px rgba(255, 204, 0, 0.35));
      transform: scale(1.02);
    }

    .login-logo .logo-sub {
      color: rgba(255,255,255,0.3);
      font-size: 1.1rem;
      letter-spacing: 6px;
      text-transform: uppercase;
    }

    .login-card {
      width: 100%;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 36px 32px;
      border: 1px solid rgba(255, 204, 0, 0.12);
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }

    .login-card h3 {
      color: #ffcc00;
      font-size: 1.6rem;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .login-card input {
      width: 100%;
      padding: 16px 20px;
      margin-bottom: 16px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255, 204, 0, 0.15);
      border-radius: 16px;
      color: #ffcc00;
      font-size: 1.2rem;
      outline: none;
      transition: all 0.3s;
    }

    .login-card input:focus {
      border-color: #ffcc00;
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.05);
    }

    .login-card input::placeholder {
      color: rgba(255,255,255,0.3);
      font-size: 1.1rem;
    }

    .login-card .btn {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      background: linear-gradient(135deg, #ffcc00, #e6b800);
      color: #000;
      font-weight: 700;
      font-size: 1.3rem;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.3s;
      box-shadow: 0 4px 20px rgba(255, 204, 0, 0.15);
    }

    .login-card .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(255, 204, 0, 0.25);
    }

    .login-card .btn:active {
      transform: scale(0.98);
    }

    /* ==================== RODAPÉ DA TELA DE LOGIN ==================== */
    .login-footer {
      text-align: center;
      padding: 8px 0 4px 0;
      width: 100%;
      margin-top: 4px;
    }

    .login-footer .footer-text {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.35);
      letter-spacing: 1px;
      font-weight: 500;
    }

    .login-footer .footer-text strong {
      color: #ffcc00 !important;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .login-footer .footer-text .code-icon {
      color: rgba(255, 204, 0, 0.2);
      font-size: 0.75rem;
      margin-left: 4px;
    }

    /* ==================== PAINEL PRINCIPAL ==================== */
    #panelScreen {
      padding: 0;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 4px 12px 4px;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      flex-shrink: 0;
    }

    .panel-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .panel-brand img {
      height: 50px;
      width: auto;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .panel-brand img:hover {
      filter: drop-shadow(0 0 20px rgba(255, 204, 0, 0.2));
    }

    .panel-brand .status {
      color: rgba(255,255,255,0.3);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .panel-brand .status .dot {
      width: 8px;
      height: 8px;
      background: #00ff44;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .panel-user {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .panel-user .user-info {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ffcc00;
      font-size: 0.95rem;
    }

    .panel-user .user-info i {
      font-size: 1.2rem;
    }

    .panel-user .user-info .badge {
      background: rgba(255, 204, 0, 0.12);
      padding: 4px 14px;
      border-radius: 24px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #ffcc00;
      border: 1px solid rgba(255, 204, 0, 0.08);
    }

    .panel-user .user-info .master-badge {
      background: rgba(255, 0, 0, 0.15);
      color: #ff4444;
      padding: 4px 10px;
      border-radius: 24px;
      font-size: 0.65rem;
      font-weight: 700;
      border: 1px solid rgba(255, 0, 0, 0.1);
    }

    .btn-logout {
      background: transparent;
      color: rgba(255,255,255,0.4);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 8px 16px;
      border-radius: 24px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-logout:hover {
      background: rgba(255,255,255,0.04);
      color: #ffcc00;
      border-color: rgba(255, 204, 0, 0.15);
    }

    /* ==================== DASHBOARD ==================== */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      width: 100%;
      padding: 14px 0 16px 0;
      flex-shrink: 0;
    }

    .stat-card {
      background: rgba(255,255,255,0.03);
      border-radius: 16px;
      padding: 14px 16px;
      border: 1px solid rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s;
    }

    .stat-card:hover {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255, 204, 0, 0.08);
    }

    .stat-card .icon {
      font-size: 1.4rem;
      color: #ffcc00;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 204, 0, 0.06);
      border-radius: 12px;
    }

    .stat-card .info {
      flex: 1;
      min-width: 0;
    }

    .stat-card .info .label {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .stat-card .info .value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffcc00;
      line-height: 1.2;
    }

    .stat-card.highlight {
      border-color: rgba(255, 204, 0, 0.15);
      background: rgba(255, 204, 0, 0.04);
    }

    /* ==================== CONTEÚDO PRINCIPAL ==================== */
    .main-content {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .content-card {
      background: rgba(255,255,255,0.03);
      border-radius: 18px;
      padding: 16px 16px 0 16px;
      border: 1px solid rgba(255,255,255,0.04);
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .content-card .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .content-card .card-header h3 {
      color: #ffcc00;
      font-size: 1.2rem;
      font-weight: 600;
    }

    .content-card .card-header h3 i {
      font-size: 1.1rem;
    }

    .content-card .card-header .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-left: auto;
    }

    .btn-sm {
      padding: 8px 16px;
      font-size: 0.85rem;
      border-radius: 22px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s;
      font-weight: 600;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ffcc00, #e6b800);
      color: #000;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(255, 204, 0, 0.2);
    }

    .btn-outline {
      background: transparent;
      color: #ffcc00;
      border: 1px solid rgba(255, 204, 0, 0.15);
    }

    .btn-outline:hover {
      background: rgba(255, 204, 0, 0.04);
      border-color: rgba(255, 204, 0, 0.3);
    }

    /* ==================== LISTA DE O.S. ==================== */
    .os-list {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      padding-bottom: 8px;
    }

    .os-list::-webkit-scrollbar {
      width: 5px;
    }

    .os-list::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.02);
      border-radius: 10px;
    }

    .os-list::-webkit-scrollbar-thumb {
      background: rgba(255, 204, 0, 0.2);
      border-radius: 10px;
    }

    .os-card {
      background: rgba(255,255,255,0.03);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 8px;
      border: 1px solid rgba(255,255,255,0.04);
      transition: all 0.3s;
    }

    .os-card:hover {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255, 204, 0, 0.06);
    }

    .os-card.prioridade-urgente { border-left: 4px solid #ff0040; }
    .os-card.prioridade-alta { border-left: 4px solid #ff6600; }
    .os-card.prioridade-normal { border-left: 4px solid #ffcc00; }
    .os-card.prioridade-baixa { border-left: 4px solid #0066ff; }
    .os-card.minha-os { border-color: rgba(255, 204, 0, 0.25); }

    .os-card .os-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      flex-wrap: wrap;
    }

    .os-card .os-title {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .os-card .os-title .protocolo {
      background: rgba(255, 204, 0, 0.08);
      color: #ffcc00;
      padding: 3px 12px;
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 700;
      border: 1px solid rgba(255, 204, 0, 0.06);
    }

    .os-card .os-title .codmoni {
      color: rgba(255,255,255,0.5);
      font-size: 0.9rem;
      font-weight: 500;
    }

    .os-card .os-title .cliente {
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
    }

    .os-card .os-title .star {
      color: #ffcc00;
      font-size: 0.9rem;
    }

    .os-card .os-status {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .badge-status {
      padding: 4px 12px;
      border-radius: 14px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-aberta { background: rgba(255, 102, 0, 0.15); color: #ff6600; }
    .badge-andamento { background: rgba(0, 102, 255, 0.15); color: #0066ff; }
    .badge-pendente { background: rgba(255, 204, 0, 0.15); color: #ffcc00; }
    .badge-finalizada { background: rgba(0, 204, 102, 0.15); color: #00cc66; }

    .badge-pagamento {
      padding: 3px 12px;
      border-radius: 14px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .badge-pago { background: rgba(0, 204, 102, 0.12); color: #00cc66; }
    .badge-gratis { background: rgba(255, 204, 0, 0.12); color: #ffcc00; }
    .badge-falta-pagar { background: rgba(255, 102, 0, 0.12); color: #ff6600; }

    .os-card .os-body {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.35);
    }

    .os-card .os-body span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .os-card .os-body span i {
      font-size: 0.75rem;
      width: 16px;
    }

    .os-card .os-actions {
      margin-top: 10px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .os-card .os-actions .btn-xs {
      padding: 5px 12px;
      font-size: 0.75rem;
      border-radius: 14px;
      border: 1px solid rgba(255, 204, 0, 0.08);
      background: transparent;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 500;
    }

    .os-card .os-actions .btn-xs:hover {
      background: rgba(255, 204, 0, 0.04);
      color: #ffcc00;
      border-color: rgba(255, 204, 0, 0.15);
    }

    .os-card .os-actions .btn-xs.danger:hover {
      color: #ff4444;
      border-color: rgba(255, 68, 68, 0.15);
    }

    .os-card .timeline {
      margin-top: 10px;
      padding: 10px 12px;
      background: rgba(0,0,0,0.2);
      border-radius: 10px;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.35);
      max-height: 100px;
      overflow-y: auto;
      border-left: 2px solid rgba(255, 204, 0, 0.1);
    }

    .os-card .timeline div {
      margin-top: 3px;
    }

    .os-card .timeline .time {
      color: rgba(255, 204, 0, 0.3);
    }

    /* ==================== FORMULÁRIOS ==================== */
    .form-group {
      margin-bottom: 12px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px 16px;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255, 204, 0, 0.08);
      border-radius: 12px;
      color: #ffcc00;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: rgba(255, 204, 0, 0.2);
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.02);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 70px;
    }

    /* ==================== BARRA DE NAVEGAÇÃO INFERIOR - MAIOR ==================== */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: rgba(20, 20, 30, 0.95);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-top: 1px solid rgba(255, 204, 0, 0.1);
      padding: 10px 0 16px 0;
      flex-shrink: 0;
      margin: 0 -12px;
      padding-left: 12px;
      padding-right: 12px;
      border-radius: 24px 24px 0 0;
      position: relative;
      z-index: 10;
      min-height: 80px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 6px 12px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.25);
      position: relative;
      min-width: 60px;
      flex: 1;
      border-radius: 16px;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-item::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 50%;
      transform: translateX(-50%) scaleX(0);
      width: 28px;
      height: 4px;
      background: #ffcc00;
      border-radius: 6px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .nav-item.active {
      color: #ffcc00;
    }

    .nav-item.active::after {
      transform: translateX(-50%) scaleX(1);
    }

    .nav-item:hover {
      color: rgba(255, 204, 0, 0.6);
    }

    .nav-item.active:hover {
      color: #ffcc00;
    }

    .nav-item .nav-icon {
      font-size: 1.6rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      line-height: 1;
    }

    .nav-item.active .nav-icon {
      transform: translateY(-3px) scale(1.15);
    }

    .nav-item .nav-label {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: all 0.3s;
      line-height: 1.2;
    }

    .nav-item.active .nav-label {
      color: #ffcc00;
      font-weight: 700;
    }

    .nav-item .nav-badge {
      position: absolute;
      top: -2px;
      right: 2px;
      background: #ff0040;
      color: #fff;
      font-size: 0.55rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 14px;
      min-width: 20px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(255, 0, 64, 0.4);
      animation: badgePulse 2s ease-in-out infinite;
    }

    @keyframes badgePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    /* ==================== EMPTY STATE ==================== */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: rgba(255,255,255,0.15);
    }

    .empty-state i {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 12px;
      color: rgba(255, 204, 0, 0.08);
    }

    .empty-state p {
      font-size: 1rem;
    }

    /* ==================== LOADING ==================== */
    .loading {
      text-align: center;
      padding: 30px;
      color: #ffcc00;
      font-size: 1.1rem;
    }

    .loading i {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ==================== HIDDEN ==================== */
    .hidden {
      display: none !important;
    }

    /* ==================== CHECKBOX ==================== */
    .os-check {
      width: 18px;
      height: 18px;
      accent-color: #ffcc00;
      cursor: pointer;
      margin-right: 6px;
    }

    /* ==================== RESPONSIVIDADE ==================== */
    @media (max-width: 768px) {
      #app { padding: 8px 8px 0 8px; }
      html, body { font-size: 16px; }
      
      .login-logo img { max-width: 220px; }
      .login-logo .logo-sub { font-size: 0.9rem; }
      .login-card { padding: 24px 20px; }
      .login-card h3 { font-size: 1.3rem; }
      .login-card input { font-size: 1rem; padding: 14px 16px; }
      .login-card .btn { font-size: 1.1rem; padding: 14px; }
      
      .login-footer .footer-text { font-size: 0.85rem; }
      .login-footer .footer-text strong { font-size: 0.95rem; }
      
      .dashboard-grid {
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 8px;
        padding: 10px 0 12px 0;
      }
      
      .stat-card { padding: 12px 14px; }
      .stat-card .icon { width: 36px; height: 36px; font-size: 1.2rem; }

  <script>
    // ==================== CRIAR MANIFEST.JSON DINAMICAMENTE ====================
    (function() {
      const manifest = {
        "name": "TOTAL - Central de O.S.",
        "short_name": "TOTAL",
        "description": "Sistema de monitoramento e ordens de serviço TOTAL",
        "start_url": ".",
        "display": "standalone",
        "background_color": "#ffcc00",
        "theme_color": "#ffcc00",

          { "src": "logo.png", "sizes": "512x512", "type": "image/png", "purpose": "any maskable" }
        ]
      };

      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.querySelector('link[rel="manifest"]');
      if (link) link.href = url;
    })();

    // ==================== SERVICE WORKER ====================
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          self.addEventListener('install', function(e) {
            e.waitUntil(caches.open('total-v1').then(function(cache) {
              return cache.addAll(['/', '/index.html', '/logo.png']);
            }));
          });
          self.addEventListener('fetch', function(e) {
            e.respondWith(caches.match(e.request).then(function(response) {
              return response || fetch(e.request);
            }));
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(() => {});
      });
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
    import { getDatabase, ref, set, get, update, push, onValue, off, remove } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";

    // ==================== FIREBASE ====================
    const firebaseConfig = {
      apiKey: "AIzaSyDbHbOk08Q_8sVlYFNmqrMjl29ssT4KyqM",
      authDomain: "totalpainel-760ba.firebaseapp.com",
      databaseURL: "https://totalpainel-760ba-default-rtdb.firebaseio.com",
      projectId: "totalpainel-760ba",
      storageBucket: "totalpainel-760ba.firebasestorage.app",
      messagingSenderId: "127781334630",
      appId: "1:127781334630:web:e0d98bf3b34ada430f87a7"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const usersRef = ref(database, 'users');
    const ordensRef = ref(database, 'ordens');
    const configRef = ref(database, 'config');

    let currentUser = null;
    let ordensListener = null;
    let abaAtual = 'minhas';

    const homeScreen = document.getElementById('homeScreen');
    const panelScreen = document.getElementById('panelScreen');
    const profileContent = document.getElementById('profileContent');
    const dashboardArea = document.getElementById('dashboardArea');
    const userName = document.getElementById('userName');
    const userRole = document.getElementById('userRole');
    const masterBadge = document.getElementById('masterBadge');
    const bottomNav = document.getElementById('bottomNav');

    // ==================== UTILITÁRIOS ====================
    function getNow() {
      const d = new Date();
      return { 
        data: d.toLocaleDateString('pt-BR'), 
        hora: d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) 
      };
    }

    async function getNextProtocolo() {
      const snapshot = await get(configRef);
      let config = snapshot.val() || {};
      if (!config.nextProtocolo) {
        config.nextProtocolo = 458921;
        await set(configRef, config);
      }
      const next = config.nextProtocolo;
      await update(configRef, { nextProtocolo: next + 1 });
      return next;
    }

    function getStatusBadgeClass(status) {
      switch(status) {
        case 'ABERTA': return 'badge-aberta';
        case 'EM ANDAMENTO': return 'badge-andamento';
        case 'PENDENTE': return 'badge-pendente';
        case 'FINALIZADA': return 'badge-finalizada';
        default: return '';
      }
    }

    function getPrioridadeClass(prioridade) {
      if (!prioridade) return '';
      if (prioridade.includes('Urgente')) return 'prioridade-urgente';
      if (prioridade.includes('Alta')) return 'prioridade-alta';
      if (prioridade.includes('Normal')) return 'prioridade-normal';
      if (prioridade.includes('Baixa')) return 'prioridade-baixa';
      return '';
    }

    function isMaster() {
      return currentUser && currentUser.isMaster === true;
    }

    function salvarSessao(user) {
      try { localStorage.setItem('total_user_session', JSON.stringify(user)); } catch (e) {}
    }

    function removerSessao() {
      try { localStorage.removeItem('total_user_session'); } catch (e) {}
    }

    function recuperarSessao() {
      try {
        const data = localStorage.getItem('total_user_session');
        if (data) return JSON.parse(data);
      } catch (e) {}
      return null;
    }

    // ==================== NAVEGAÇÃO INFERIOR ====================
    function setupBottomNav(ordens) {
      const navItems = bottomNav.querySelectorAll('.nav-item');
      
      const total = ordens.length;
      const abertas = ordens.filter(o => o.status === 'ABERTA').length;
      const andamento = ordens.filter(o => o.status === 'EM ANDAMENTO').length;
      const pendentes = ordens.filter(o => o.status === 'PENDENTE').length;
      const finalizadas = ordens.filter(o => o.status === 'FINALIZADA').length;
      
      let minhas = 0;
      if (currentUser) {
        if (currentUser.funcao === 'Operador') {
          minhas = ordens.filter(o => o.operador === currentUser.usuario && o.status !== 'FINALIZADA').length;
        } else if (currentUser.funcao === 'Tecnico') {
          minhas = ordens.filter(o => o.tecnico === currentUser.usuario && o.status !== 'FINALIZADA').length;
        } else if (currentUser.funcao === 'Gestor' || isMaster()) {
          minhas = ordens.filter(o => o.status !== 'FINALIZADA').length;
        }
      }
      
      document.getElementById('badgeMinhas').textContent = minhas;
      document.getElementById('badgeAbertas').textContent = abertas;
      document.getElementById('badgeAndamento').textContent = andamento;
      document.getElementById('badgePendentes').textContent = pendentes;
      document.getElementById('badgeFinalizadas').textContent = finalizadas;
      document.getElementById('badgeTodas').textContent = total;
      
      document.querySelectorAll('.nav-badge').forEach(badge => {
        if (badge.textContent === '0') {
          badge.style.display = 'none';
        } else {
          badge.style.display = 'block';
        }
      });

      navItems.forEach(item => {
        item.addEventListener('click', function() {
          const tab = this.dataset.tab;
          navItems.forEach(n => n.classList.remove('active'));
          this.classList.add('active');
          abaAtual = tab;
          
          if (currentUser) {
            if (isMaster()) {
              const ordensAtuais = window.ordensLista || [];
              listarOrdensGestor(ordensAtuais);
            } else if (currentUser.funcao === 'Operador') {
              const ordensAtuais = window.ordensLista || [];
              listarOrdensOperador(ordensAtuais);
            } else if (currentUser.funcao === 'Tecnico') {
              const ordensAtuais = window.ordensLista || [];
              listarOrdensTecnico(ordensAtuais);
            }
          }
        });
      });
    }

    // ==================== LOGIN ====================
    document.getElementById('btnLoginExec').addEventListener('click', async () => {
      const usuario = document.getElementById('loginUser').value.trim().toUpperCase();
      const senha = document.getElementById('loginPass').value.trim();
      
      if (!usuario || !senha) {
        alert('Preencha usuário e senha!');
        return;
      }
      
      try {
        const snapshot = await get(usersRef);
        const users = snapshot.val() || {};
        
        let found = null;
        
        if (usuario === 'IRLAN' && senha === '4747') {
          found = { usuario: 'IRLAN', senha: '4747', funcao: 'Gestor', isMaster: true };
        } else {
          found = Object.values(users).find(u => u.usuario === usuario && u.senha === senha);
        }
        
        if (!found) {
          alert('Credenciais inválidas!');
          return;
        }
        
        salvarSessao(found);
        await entrarNoSistema(found);
        
      } catch (error) {
        alert('Erro ao fazer login. Verifique a conexão.');
        console.error(error);
      }
    });

    document.getElementById('loginPass').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('btnLoginExec').click();
    });

    document.getElementById('loginUser').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('loginPass').focus();
    });

    // ==================== SISTEMA ====================
    async function entrarNoSistema(user) {
      currentUser = user;
      abaAtual = 'minhas';
      
      userName.textContent = user.usuario;
      userRole.textContent = user.funcao;
      
      if (user.isMaster) {
        masterBadge.classList.remove('hidden');
      } else {
        masterBadge.classList.add('hidden');
      }
      
      homeScreen.classList.remove('active');
      panelScreen.classList.add('active');
      
      document.getElementById('loginUser').value = '';
      document.getElementById('loginPass').value = '';
      
      await renderPanel();
    }

    document.getElementById('btnLogout').addEventListener('click', () => {
      if (ordensListener) {
        off(ordensRef, 'value', ordensListener);
        ordensListener = null;
      }
      currentUser = null;
      abaAtual = 'minhas';
      removerSessao();
      panelScreen.classList.remove('active');
      homeScreen.classList.add('active');
    });

    function atualizarDashboard(ordens) {
      const abertas = ordens.filter(o => o.status === 'ABERTA').length;
      const andamento = ordens.filter(o => o.status === 'EM ANDAMENTO').length;
      const pendentes = ordens.filter(o => o.status === 'PENDENTE').length;
      const finalizadas = ordens.filter(o => o.status === 'FINALIZADA').length;
      const tecnicosUnicos = [...new Set(ordens.filter(o => o.tecnico && o.status === 'EM ANDAMENTO').map(o => o.tecnico))];
      const tecEmAtend = tecnicosUnicos.length;
      
      let minhasOS = 0;
      if (currentUser) {
        if (currentUser.funcao === 'Operador') {
          minhasOS = ordens.filter(o => o.operador === currentUser.usuario && o.status !== 'FINALIZADA').length;
        } else if (currentUser.funcao === 'Tecnico') {
          minhasOS = ordens.filter(o => o.tecnico === currentUser.usuario && o.status !== 'FINALIZADA').length;
        } else if (currentUser.funcao === 'Gestor' || isMaster()) {
          minhasOS = ordens.filter(o => o.status !== 'FINALIZADA').length;
        }
      }
      
      const cards = dashboardArea.querySelectorAll('.stat-card');
      if (cards.length >= 6) {
        cards[0].querySelector('.value').textContent = abertas;
        cards[1].querySelector('.value').textContent = andamento;
        cards[2].querySelector('.value').textContent = pendentes;
        cards[3].querySelector('.value').textContent = finalizadas;
        cards[4].querySelector('.value').textContent = tecEmAtend;
        cards[5].querySelector('.value').textContent = minhasOS;
      }
    }

    async function renderPanel() {
      if (!currentUser) return;
      
      profileContent.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i> Carregando dados...</div>';
      
      if (ordensListener) {
        off(ordensRef, 'value', ordensListener);
      }
      
      ordensListener = onValue(ordensRef, (snapshot) => {
        const ordensData = snapshot.val() || {};
        const ordensList = Object.entries(ordensData).map(([key, value]) => ({
          id: key,
          ...value
        }));
        
        window.ordensLista = ordensList;
        
        atualizarDashboard(ordensList);
        setupBottomNav(ordensList);
        
        if (isMaster()) {
          renderGestor(ordensList, true);
          setTimeout(() => {
            const navItems = bottomNav.querySelectorAll('.nav-item');
            navItems.forEach(item => {
              if (item.dataset.tab === abaAtual) {

    async function addTimeline(ordemId, texto) {
      const ordemRef = ref(database, `ordens/${ordemId}/timeline`);
      const snapshot = await get(ordemRef);
      const timeline = snapshot.val() || [];
      timeline.push({ hora: getNow().hora, texto });
      await set(ordemRef, timeline);
    }

    async function buscarOuAbrirOS(ordens) {
      const cod = document.getElementById('codMoniInput').value.trim();
      if (!cod) return alert('Informe o código MONI');
      
      const existente = ordens.find(o => o.codMoni === cod && o.status !== 'FINALIZADA');
      const novaDiv = document.getElementById('novaOsForm');
      const msgDiv = document.getElementById('osExistenteMsg');
      
      if (existente) {
        msgDiv.classList.remove('hidden');
        msgDiv.innerHTML = `
          <div style="background:rgba(255,204,0,0.04);border:1px solid rgba(255,204,0,0.08);border-radius:14px;padding:16px;margin-bottom:16px;">
            <i class="fas fa-exclamation-triangle" style="color:#ffcc00;font-size:1.2rem;"></i>
            <strong style="color:#ffcc00;font-size:1.1rem;">Já existe O.S. aberta para este Código MONI</strong><br>
            <span style="color:rgba(255,255,255,0.5);font-size:1rem;">
              Protocolo: <strong style="color:#ffcc00;">${existente.protocolo}</strong> | 
              Operador: ${existente.operador}<br>
              Data: ${existente.dataAbertura} | Hora: ${existente.horaAbertura}<br>
              Status: <span class="badge-status ${getStatusBadgeClass(existente.status)}">${existente.status}</span>
            </span>
            <br>
            <button class="btn-sm btn-outline" id="btnCancelarExistente" style="margin-top:10px;">Cancelar</button>
          </div>`;
        
        document.getElementById('btnCancelarExistente').addEventListener('click', () => {
          msgDiv.classList.add('hidden');
        });
        novaDiv.classList.add('hidden');
      } else {
        msgDiv.classList.add('hidden');
        novaDiv.classList.remove('hidden');
        novaDiv.innerHTML = `
          <div style="background:rgba(255,204,0,0.03);border:1px solid rgba(255,204,0,0.08);border-radius:14px;padding:18px;margin-bottom:16px;">
            <h4 style="color:#ffcc00;font-size:1.15rem;margin-bottom:14px;"><i class="fas fa-plus-circle"></i> Nova Ordem de Serviço</h4>
            <div class="form-group">
              <input type="text" id="nomeCliente" placeholder="Nome do Cliente">
            </div>
            <div class="form-group">
              <input type="text" id="enderecoCliente" placeholder="Endereço">
            </div>
            <div class="form-group">
              <textarea id="obsAbertura" placeholder="Observação" rows="2"></textarea>
            </div>
            <button class="btn-sm btn-primary" id="btnSalvarOS">
              <i class="fas fa-save"></i> Salvar O.S.
            </button>
          </div>`;
        
        document.getElementById('btnSalvarOS').addEventListener('click', async () => {
          const cliente = document.getElementById('nomeCliente').value.trim();
          const endereco = document.getElementById('enderecoCliente').value.trim();
          const obs = document.getElementById('obsAbertura').value.trim();
          
          if (!cliente) {
            alert('Nome do cliente é obrigatório!');
            return;
          }
          
          try {
            const protocolo = await getNextProtocolo();
            const { data, hora } = getNow();
            
            const novaOS = {
              protocolo,
              codMoni: cod,
              cliente,
              endereco: endereco || 'Não informado',
              observacao: obs,
              operador: currentUser.usuario,
              dataAbertura: data,
              horaAbertura: hora,
              status: 'ABERTA',
              prioridade: null,
              tecnico: null,
              statusPagamento: null,
              tecnicoInicio: null,
              tecnicoFinalizacao: null,
              timeline: [{ hora, texto: `Operador ${currentUser.usuario} abriu a O.S.` }]
            };
            
            await push(ordensRef, novaOS);
            novaDiv.classList.add('hidden');
            document.getElementById('codMoniInput').value = '';
            alert('✅ O.S. aberta com sucesso!');
            
          } catch (error) {
            alert('Erro ao salvar O.S. Tente novamente.');
            console.error(error);
          }
        });
      }
    }

    // ==================== FUNÇÕES GLOBAIS ====================
    window.reabrirOS = async function(osId) {
      if (!confirm('⚠️ Reabrir esta O.S. finalizada?')) return;
      try {
        const { data, hora } = getNow();
        await update(ref(database, `ordens/${osId}`), { status: 'ABERTA', dataReabertura: data, horaReabertura: hora });
        await addTimeline(osId, `Operador ${currentUser.usuario} reabriu a O.S.`);
        alert('✅ O.S. reaberta!');
      } catch (error) {
        alert('❌ Erro ao reabrir.');
        console.error(error);
      }
    };

    window.transferirOS = async function(osId) {
      const novo = prompt('Nome do novo técnico:');
      if (!novo) return;
      try {
        await update(ref(database, `ordens/${osId}`), { tecnico: novo });
        await addTimeline(osId, `Gestor transferiu para ${novo}`);
        alert('✅ Transferida!');
      } catch (error) {
        alert('❌ Erro ao transferir.');
        console.error(error);
      }
    };

    window.alterarStatusOS = async function(osId) {
      const status = prompt('Novo status (ABERTA, EM ANDAMENTO, PENDENTE, FINALIZADA):');
      if (!status) return;
      const validos = ['ABERTA', 'EM ANDAMENTO', 'PENDENTE', 'FINALIZADA'];
      if (!validos.includes(status.toUpperCase())) {
        alert('Status inválido!');
        return;
      }
      try {
        await update(ref(database, `ordens/${osId}`), { status: status.toUpperCase() });
        await addTimeline(osId, `Gestor alterou status para ${status.toUpperCase()}`);
        alert('✅ Status alterado!');
      } catch (error) {
        alert('❌ Erro ao alterar.');
        console.error(error);
      }
    };

    window.editarOS = async function(osId) {
      try {
        const snapshot = await get(ref(database, `ordens/${osId}`));
        const os = snapshot.val();
        if (!os) { alert('O.S. não encontrada!'); return; }
        
        const cliente = prompt('Cliente:', os.cliente) || os.cliente;
        const endereco = prompt('Endereço:', os.endereco || '') || os.endereco || 'Não informado';
        const obs = prompt('Observação:', os.observacao || '') || os.observacao || '';
        
        await update(ref(database, `ordens/${osId}`), { cliente, endereco, observacao: obs });
        await addTimeline(osId, 'Gestor editou informações');
        alert('✅ Editada!');
      } catch (error) {
        alert('❌ Erro ao editar.');
        console.error(error);
      }
    };

    window.removerOS = async function(osId) {
      if (!isMaster()) { alert('Apenas Master pode excluir!'); return; }
      if (!confirm('⚠️ Excluir permanentemente?')) return;
      try {
        await remove(ref(database, `ordens/${osId}`));
        alert('✅ Excluída!');
      } catch (error) {
        alert('❌ Erro ao excluir.');
        console.error(error);
      }
    };

    window.assumirOS = async function(osId) {
      try {
        const snapshot = await get(ref(database, `ordens/${osId}`));
        const os = snapshot.val();
        if (os.tecnico && os.tecnico !== currentUser.usuario) {
          alert('⚠️ Já está com outro técnico!');
          return;
        }
        const tecnicoInicio = prompt('Nome do técnico/auxiliar iniciando:');
        if (!tecnicoInicio) return;
        
        await update(ref(database, `ordens/${osId}`), {
          tecnico: currentUser.usuario,
          status: 'EM ANDAMENTO',
          tecnicoInicio
        });
        await addTimeline(osId, `Técnico ${currentUser.usuario} assumiu`);
        await addTimeline(osId, `Iniciando: ${tecnicoInicio}`);
        alert('✅ Assumida!');
      } catch (error) {
        alert('❌ Erro ao assumir.');
        console.error(error);
      }
    };

    window.pendenteOS = async function(osId) {
      const motivo = prompt('Motivo da pendência:');
      if (!motivo) return;
      try {
        await update(ref(database, `ordens/${osId}`), { status: 'PENDENTE' });
        await addTimeline(osId, `PENDENTE - Motivo: ${motivo}`);
        alert('✅ Pendente!');
      } catch (error) {
        alert('❌ Erro ao pausar.');
        console.error(error);
      }
    };

    window.finalizarOS = async function(osId) {
      try {
        const snapshot = await get(ref(database, `ordens/${osId}`));
        const os = snapshot.val();
        
        if (!confirm('⚠️ Confirmar finalização da O.S.?')) return;
        
        const protocolo = prompt('Digite o número do protocolo:');
        if (!protocolo) return;
        if (parseInt(protocolo) !== os.protocolo) {
          alert('❌ Protocolo incorreto!');
          return;
        }
        
        const tecnicoFinal = prompt('Nome do técnico/auxiliar finalizando:');
        if (!tecnicoFinal) return;
        
        const pagamento = prompt('Pagamento (1-PAGO, 2-GRÁTIS, 3-FALTA PAGAR):');
        let statusPagamento = null;
        if (pagamento === '1') statusPagamento = 'PAGO';
        else if (pagamento === '2') statusPagamento = 'GRATIS';
        else if (pagamento === '3') statusPagamento = 'FALTA PAGAR';
        else { alert('Opção inválida!'); return; }
        
        const materiais = prompt('Materiais utilizados:');
        const obsFinais = prompt('Observações finais:');
        
        await update(ref(database, `ordens/${osId}`), {
          status: 'FINALIZADA',
          materiaisUtilizados: materiais || 'Não informado',
          observacoesFinais: obsFinais || 'Não informado',
          tecnicoFinalizacao: tecnicoFinal,
          statusPagamento
        });
        await addTimeline(osId, `Finalizando: ${tecnicoFinal}`);
        await addTimeline(osId, `Materiais: ${materiais || 'N/A'}`);
        await addTimeline(osId, `Pagamento: ${statusPagamento}`);
        alert('✅ Finalizada!');
      } catch (error) {
        alert('❌ Erro ao finalizar.');
        console.error(error);
      }
    };

    async function definirPrioridade(ordens) {
      const checks = [...document.querySelectorAll('.os-check:checked')].map(c => c.value);
      if (!checks.length) return alert('Selecione pelo menos uma O.S.');
      
      const prior = prompt('Prioridade (1-Urgente, 2-Alta, 3-Normal, 4-Baixa):');
      if (!prior || !['1','2','3','4'].includes(prior)) return;
      
      const priorMap = { '1': '🔴 Urgente', '2': '🟠 Alta', '3': '🟡 Normal', '4': '🔵 Baixa' };
      
      try {
        for (const osId of checks) {
          await update(ref(database, `ordens/${osId}`), { prioridade: priorMap[prior] });
          await addTimeline(osId, `Prioridade definida: ${priorMap[prior]}`);
        }
        alert('✅ Prioridades definidas!');
      } catch (error) {
        alert('❌ Erro ao definir.');
        console.error(error);
      }
    }

    async function enviarParaTecnicos(ordens) {
      const checks = [...document.querySelectorAll('.os-check:checked')].map(c => c.value);
      if (!checks.length) return alert('Selecione pelo menos uma O.S.');
      
      try {
        for (const osId of checks) {
          await addTimeline(osId, 'Enviada para fila dos técnicos');
        }
        alert('✅ Enviadas!');
      } catch (error) {
        alert('❌ Erro ao enviar.');
        console.error(error);
      }
    }

    async function carregarGerenciamentoUsuarios() {
      const area = document.getElementById('gerenciarUsuariosArea');
      if (!area) return;
      
      try {
        const snapshot = await get(usersRef);
        const users = snapshot.val() || {};
        const userList = Object.entries(users).map(([key, value]) => ({ id: key, ...value }));
        
        area.innerHTML = `
          <div style="background:rgba(255,204,0,0.03);border:1px solid rgba(255,204,0,0.08);border-radius:14px;padding:18px;margin-bottom:16px;">
            <h4 style="color:#ffcc00;font-size:1.15rem;margin-bottom:14px;"><i class="fas fa-users"></i> Gerenciar Usuários</h4>
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
              <input type="text" id="novoUsuarioNome" placeholder="Nome" style="flex:1;min-width:140px;padding:12px 16px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,204,0,0.08);border-radius:12px;color:#fff;font-size:1rem;outline:none;">
              <input type="password" id="novoUsuarioSenha" placeholder="Senha" style="flex:1;min-width:120px;padding:12px 16px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,204,0,0.08);border-radius:12px;color:#fff;font-size:1rem;outline:none;">
              <select id="novoUsuarioFuncao" style="padding:12px 16px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,204,0,0.08);border-radius:12px;color:#ffcc00;font-size:1rem;outline:none;">
                <option value="Operador">Operador</option>
                <option value="Tecnico">Técnico</option>
                <option value="Gestor">Gestor</option>
              </select>
              <button class="btn-sm btn-primary" id="btnAdicionarUsuario"><i class="fas fa-plus"></i> Adicionar</button>
            </div>
            <div id="addUserMsg" style="font-size:1rem;margin-bottom:12px;"></div>
            <div class="user-list">
              ${userList.length === 0 ? '<p style="color:rgba(255,255,255,0.2);font-size:1rem;">Nenhum usuário cadastrado.</p>' : 
                userList.map(u => `
                  <div class="user-item">
                    <div>
                      <span class="user-name">${u.usuario}</span>
                      <span class="user-role">${u.funcao}</span>
                      ${u.turno ? `<span style="font-size:0.75rem;color:rgba(255,255,255,0.2);">Turno: ${u.turno}</span>` : ''}
                    </div>
                    <button class="btn-xs danger" onclick="window.removerUsuario('${u.id}')" style="color:#ff4444;border-color:rgba(255,68,68,0.1);">
                      <i class="fas fa-trash"></i>
                    </button>
                  </div>
                `).join('')
              }
            </div>
          </div>
        `;
        
        document.getElementById('btnAdicionarUsuario').addEventListener('click', async () => {
          const nome = document.getElementById('novoUsuarioNome').value.trim().toUpperCase();
          const senha = document.getElementById('novoUsuarioSenha').value.trim();
          const funcao = document.getElementById('novoUsuarioFuncao').value;
          const msg = document.getElementById('addUserMsg');
          
          if (!nome || !senha) {
            msg.innerHTML = '⚠️ Preencha nome e senha!';
            return;
          }
          
          try {
            const snapshot = await get(usersRef);
            const users = snapshot.val() || {};
            const exists = Object.values(users).some(u => u.usuario === nome);
            
            if (exists) {
              msg.innerHTML = '⚠️ Usuário já existe!';
              return;
            }
            
            const newUser = { usuario: nome, senha, funcao };
            if (funcao === 'Operador') {
              const turno = prompt('Turno (Diurno/Noturno):') || 'Diurno';
              newUser.turno = turno;
            }
            
            await push(usersRef, newUser);
            msg.innerHTML = '✅ Usuário adicionado!';
            setTimeout(() => carregarGerenciamentoUsuarios(), 500);
            
          } catch (error) {
            msg.innerHTML = '❌ Erro ao adicionar usuário.';
            console.error(error);
          }
        });
        
      } catch (error) {
        area.innerHTML = '<p style="color:#ff4444;">❌ Erro ao carregar usuários.</p>';
        console.error(error);
      }
    }

    window.removerUsuario = async function(userId) {
      if (!isMaster()) {
        alert('Apenas o Master pode remover usuários!');
        return;
      }
      if (!confirm('Remover este usuário?')) return;
      
      try {
        await remove(ref(database, `users/${userId}`));
        alert('✅ Usuário removido!');
        carregarGerenciamentoUsuarios();
      } catch (error) {
        alert('❌ Erro ao remover usuário.');
        console.error(error);
      }
    };

    // ==================== RESTAURAR SESSÃO ====================
    async function restaurarSessao() {
      const sessao = recuperarSessao();
      
      if (sessao) {
        console.log('🔄 Restaurando sessão...');
        
        if (sessao.isMaster) {
          await entrarNoSistema(sessao);
          return;
        }
        
        try {
          const snapshot = await get(usersRef);
          const users = snapshot.val() || {};
          const userExists = Object.values(users).some(u => u.usuario === sessao.usuario);
          
          if (userExists) {
            await entrarNoSistema(sessao);
            return;
          } else {
            removerSessao();
          }
        } catch (error) {
          console.error(error);
          removerSessao();
        }
      }
      
      homeScreen.classList.add('active');
      panelScreen.classList.remove('active');
    }

    // ==================== INICIAR ====================
    window.addEventListener('load', async () => {
      await restaurarSessao();
    });

    console.log('✅ TOTAL - Sistema de Monitoramento');
    console.log('👨‍💻 Desenvolvido por Manuel Francisco');
  </script>
</body>
</html>
