<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  
  <title>TOTAL 3D · Central de O.S.</title>
  <meta name="description" content="Sistema de monitoramento e ordens de serviço TOTAL 3D">
  <meta name="theme-color" content="#ffcc00">
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: #0a0a0a;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      color: #fff;
    }

    #three-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    #app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1400px;
      height: 100vh;
      margin: 0 auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      pointer-events: none;
    }

    #app > * {
      pointer-events: auto;
    }

    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      width: 100%;
      height: 100%;
      backdrop-filter: blur(10px);
      background: rgba(0,0,0,0.3);
      border-radius: 2rem;
      padding: 2rem;
    }

    .screen.active {
      display: flex;
    }

    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      animation: float3d 3s ease-in-out infinite;
    }

    @keyframes float3d {
      0%, 100% { transform: translateY(0px) rotateX(0deg); }
      50% { transform: translateY(-10px) rotateX(2deg); }
    }

    .logo-3d {
      font-size: 5rem;
      font-weight: 900;
      color: #ffcc00;
      text-shadow: 
        0 0 20px rgba(255, 204, 0, 0.5),
        0 0 40px rgba(255, 204, 0, 0.3),
        0 0 80px rgba(255, 204, 0, 0.1);
      transform: perspective(500px) rotateX(5deg);
      letter-spacing: 4px;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo-3d i {
      filter: drop-shadow(0 0 30px rgba(255, 204, 0, 0.6));
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border-radius: 1.8rem;
      padding: 1.8rem;
      border: 1px solid rgba(255, 204, 0, 0.2);
      box-shadow: 
        0 10px 40px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.1);
      width: 100%;
      transition: all 0.3s ease;
    }

    .card:hover {
      border-color: rgba(255, 204, 0, 0.5);
      box-shadow: 
        0 10px 50px rgba(255, 204, 0, 0.1),
        inset 0 1px 0 rgba(255,255,255,0.2);
    }

    input, select, textarea {
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255, 204, 0, 0.3);
      border-radius: 1rem;
      padding: 0.9rem 1.2rem;
      color: #ffcc00;
      font-size: 1rem;
      outline: none;
      width: 100%;
      margin-top: 0.5rem;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #ffcc00;
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.2);
    }

    .btn {
      background: linear-gradient(135deg, #ffcc00, #f0b800);
      color: #000;
      font-weight: bold;
      padding: 0.9rem 2.2rem;
      border-radius: 3rem;
      font-size: 1.2rem;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transition: all 0.3s;
      box-shadow: 0 6px 30px rgba(255, 204, 0, 0.3);
      text-shadow: 0 1px 2px rgba(255,255,255,0.3);
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 8px 40px rgba(255, 204, 0, 0.5);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-sm {
      padding: 0.5rem 1.2rem;
      font-size: 0.9rem;
    }

    .btn-outline {
      background: transparent;
      color: #ffcc00;
      border: 1.5px solid #ffcc00;
      box-shadow: none;
      text-shadow: none;
    }

    .btn-outline:hover {
      background: rgba(255, 204, 0, 0.1);
      box-shadow: 0 0 30px rgba(255, 204, 0, 0.1);
    }

    .dashboard-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      width: 100%;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 204, 0, 0.15);
      border-radius: 1.2rem;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      color: #fff;
      min-width: 150px;
      flex: 1 1 180px;
      transition: all 0.3s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .stat-card:hover {
      transform: translateY(-3px) scale(1.02);
      border-color: rgba(255, 204, 0, 0.4);
      box-shadow: 0 8px 30px rgba(255, 204, 0, 0.1);
    }

    .stat-card i {
      font-size: 1.5rem;
      color: #ffcc00;
      filter: drop-shadow(0 0 10px rgba(255, 204, 0, 0.3));
    }

    .stat-card strong {
      font-size: 1.3rem;
      color: #ffcc00;
    }

    .stat-card small {
      color: rgba(255,255,255,0.6);
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .tab {
      padding: 0.5rem 1.2rem;
      border-radius: 2rem;
      cursor: pointer;
      background: rgba(0,0,0,0.3);
      color: rgba(255,255,255,0.6);
      border: 1px solid rgba(255, 204, 0, 0.1);
      transition: all 0.3s;
      font-size: 0.9rem;
      backdrop-filter: blur(10px);
    }

    .tab.active {
      background: rgba(255, 204, 0, 0.2);
      color: #ffcc00;
      border-color: #ffcc00;
      font-weight: bold;
      box-shadow: 0 0 30px rgba(255, 204, 0, 0.1);
    }

    .tab:hover:not(.active) {
      border-color: rgba(255, 204, 0, 0.3);
      color: #fff;
    }

    .os-card {
      margin-bottom: 0.8rem;
      padding: 1.2rem;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border-radius: 1.2rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s;
    }

    .os-card:hover {
      transform: translateX(5px);
      border-color: rgba(255, 204, 0, 0.3);
      box-shadow: 0 4px 20px rgba(255, 204, 0, 0.05);
    }

    .os-card.prioridade-urgente { border-left: 6px solid #ff0040; }
    .os-card.prioridade-alta { border-left: 6px solid #ff6600; }
    .os-card.prioridade-normal { border-left: 6px solid #ffcc00; }
    .os-card.prioridade-baixa { border-left: 6px solid #0066ff; }
    .os-card.minha-os { border: 2px solid #ffcc00; }

    .badge {
      background: rgba(255, 204, 0, 0.2);
      color: #ffcc00;
      padding: 0.2rem 0.7rem;
      border-radius: 2rem;
      font-weight: bold;
      font-size: 0.8rem;
      border: 1px solid rgba(255, 204, 0, 0.2);
    }

    .badge-status {
      padding: 0.3rem 0.8rem;
      border-radius: 2rem;
      font-weight: bold;
      font-size: 0.85rem;
    }

    .badge-aberta { background: rgba(255, 102, 0, 0.3); color: #ff6600; }
    .badge-andamento { background: rgba(0, 102, 255, 0.3); color: #0066ff; }
    .badge-pendente { background: rgba(255, 204, 0, 0.3); color: #ffcc00; }
    .badge-finalizada { background: rgba(0, 204, 102, 0.3); color: #00cc66; }

    .master-badge {
      background: rgba(255, 0, 0, 0.3);
      color: #ff4444;
      padding: 0.2rem 0.7rem;
      border-radius: 2rem;
      font-weight: bold;
      font-size: 0.7rem;
      margin-left: 0.5rem;
      border: 1px solid rgba(255, 0, 0, 0.3);
    }

    .badge-pago { background: rgba(0, 204, 102, 0.3); color: #00cc66; }
    .badge-gratis { background: rgba(255, 204, 0, 0.3); color: #ffcc00; }
    .badge-falta-pagar { background: rgba(255, 102, 0, 0.3); color: #ff6600; }

    .timeline {
      background: rgba(0,0,0,0.3);
      border-radius: 1rem;
      padding: 1rem;
      margin-top: 0.8rem;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.7);
      max-height: 200px;
      overflow-y: auto;
      border-left: 3px solid #ffcc00;
    }

    .hidden { display: none !important; }

    .flex-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
    }

    .table-responsive {
      overflow-x: auto;
      border-radius: 1.2rem;
      margin-top: 1rem;
    }

    .empty-state {
      color: rgba(255,255,255,0.4);
      text-align: center;
      padding: 2rem;
    }

    .empty-state i {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      display: block;
      color: rgba(255, 204, 0, 0.3);
    }

    .status-pagamento {
      margin-top: 0.5rem;
      padding: 0.3rem 0.8rem;
      border-radius: 2rem;
      font-weight: bold;
      font-size: 0.8rem;
      display: inline-block;
    }

    .protocolo-destacado {
      background: rgba(255, 204, 0, 0.2);
      color: #ffcc00;
      padding: 0.2rem 0.8rem;
      border-radius: 2rem;
      font-weight: bold;
      font-size: 1.1rem;
      display: inline-block;
      margin-right: 0.5rem;
      border: 1px solid rgba(255, 204, 0, 0.2);
    }

    .user-manager-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .user-manager-item:last-child { border-bottom: none; }

    .btn-outline-sm {
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      background: transparent;
      color: #ffcc00;
      border: 1.5px solid #ffcc00;
      border-radius: 2rem;
      cursor: pointer;
      transition: all 0.3s;
      backdrop-filter: blur(10px);
    }

    .btn-outline-sm:hover {
      background: rgba(255, 204, 0, 0.1);
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.1);
    }

    .btn-excluir-dourado {
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      background: transparent;
      color: #ff4444;
      border: 1.5px solid #ff4444;
      border-radius: 2rem;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-excluir-dourado:hover {
      background: rgba(255, 68, 68, 0.1);
      box-shadow: 0 0 20px rgba(255, 68, 68, 0.1);
    }

    #panelScreen {
      overflow-y: auto;
      padding: 1rem;
      height: 100vh;
    }

    #panelScreen::-webkit-scrollbar {
      width: 6px;
    }

    #panelScreen::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
    }

    #panelScreen::-webkit-scrollbar-thumb {
      background: #ffcc00;
      border-radius: 10px;
    }

    .highlight-card {
      border-color: rgba(255, 204, 0, 0.4) !important;
      box-shadow: 0 0 40px rgba(255, 204, 0, 0.05) !important;
    }

    h3, h4, h5, strong {
      color: #ffcc00 !important;
    }

    .loading {
      color: #ffcc00;
      text-align: center;
      padding: 2rem;
    }

    .loading i {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #userDisplay {
      color: #ffcc00;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    @media (max-width: 768px) {
      #app { padding: 0.5rem; }
      .screen { padding: 1rem; }
      .logo-3d { font-size: 2.5rem; }
      .stat-card { min-width: 100px; flex: 1 1 120px; }
      .btn { padding: 0.7rem 1.5rem; font-size: 1rem; }
      .os-card { padding: 0.8rem; }
    }
  </style>
</head>
<body>
  <div id="three-container"></div>
  
  <div id="app">
    <!-- TELA INICIAL -->
    <div id="homeScreen" class="screen active">
      <div class="logo-area">
        <div class="logo-3d">
          <i class="fas fa-cube"></i>
          TOTAL
          <i class="fas fa-shield-alt"></i>
        </div>
        
        <div id="loginFormArea" class="card" style="max-width: 420px;">
          <h3 style="color:#ffcc00; margin-bottom:1rem; display:flex; align-items:center; gap:0.5rem;">
            <i class="fas fa-lock"></i> Login
          </h3>
          <input type="text" id="loginUser" placeholder="Usuário" autocomplete="off">
          <input type="password" id="loginPass" placeholder="Senha">
          <button class="btn" id="btnLoginExec" style="width:100%; margin-top:1rem; justify-content:center;">
            <i class="fas fa-sign-in-alt"></i> Acessar Sistema
          </button>
        </div>
      </div>
    </div>

    <!-- PAINEL PRINCIPAL -->
    <div id="panelScreen" class="screen">
      <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; flex-wrap: wrap; gap: 1rem; padding: 0 0.5rem;">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <div style="color:#ffcc00; font-size:1.8rem; font-weight:800; display:flex; align-items:center; gap:0.5rem;">
            <i class="fas fa-cube"></i> TOTAL
          </div>
          <span style="color:rgba(255,255,255,0.5); font-size:0.9rem;">
            <i class="fas fa-circle" style="color:#00ff44; font-size:0.6rem;"></i> Online
          </span>
        </div>
        <div style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
          <span id="userDisplay"></span>
          <button class="btn-outline" id="btnLogout" style="padding:0.4rem 1rem;">
            <i class="fas fa-sign-out-alt"></i> Sair
          </button>
        </div>
      </div>
      
      <div id="dashboardArea" class="dashboard-cards"></div>
      
      <div id="profileContent" class="card" style="margin-top:0.5rem;">
        <div class="loading"><i class="fas fa-spinner"></i> Carregando dados...</div>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
    import { getDatabase, ref, set, get, update, push, onValue, off, remove } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";

    // ==================== THREE.JS 3D SETUP ====================
    const container = document.getElementById('three-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0a0a, 0.002);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 15);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ 
      antialias: true, 
      alpha: true 
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5;
    controls.maxPolarAngle = Math.PI / 2.2;
    controls.minDistance = 5;
    controls.maxDistance = 25;
    controls.target.set(0, 0, 0);

    // Lights
    const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffcc00, 2);
    mainLight.position.set(10, 20, 10);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 2048;
    mainLight.shadow.mapSize.height = 2048;
    scene.add(mainLight);

    const fillLight = new THREE.DirectionalLight(0x4488ff, 0.5);
    fillLight.position.set(-10, 0, 10);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffffff, 0.3);
    rimLight.position.set(0, -10, 10);
    scene.add(rimLight);

    // Point Light for atmosphere
    const pointLight = new THREE.PointLight(0xffcc00, 1, 30);
    pointLight.position.set(0, 5, 0);
    scene.add(pointLight);

    // Background Particles
    const particlesGeometry = new THREE.BufferGeometry();
    const particlesCount = 2000;
    const posArray = new Float32Array(particlesCount * 3);
    for(let i = 0; i < particlesCount * 3; i++) {
      posArray[i] = (Math.random() - 0.5) * 80;
    }
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const particlesMaterial = new THREE.PointsMaterial({
      size: 0.08,
      color: 0xffcc00,
      transparent: true,
      opacity: 0.6,
      blending: THREE.AdditiveBlending
    });
    const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
    scene.add(particlesMesh);

    // Central Platform
    const platformGeo = new THREE.CylinderGeometry(4, 4, 0.3, 64);
    const platformMat = new THREE.MeshPhysicalMaterial({
      color: 0x1a1a2e,
      metalness: 0.8,
      roughness: 0.2,
      transparent: true,
      opacity: 0.9,
      emissive: 0xffcc00,
      emissiveIntensity: 0.05,
    });
    const platform = new THREE.Mesh(platformGeo, platformMat);
    platform.position.y = -0.15;
    platform.receiveShadow = true;
    scene.add(platform);

    // Ring
    const ringGeo = new THREE.TorusGeometry(3.5, 0.05, 16, 100);
    const ringMat = new THREE.MeshPhysicalMaterial({
      color: 0xffcc00,
      metalness: 0.9,
      roughness: 0.1,
      emissive: 0xffcc00,
      emissiveIntensity: 0.3,
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 0.1;
    scene.add(ring);

    // Inner Ring
    const innerRingGeo = new THREE.TorusGeometry(2.5, 0.03, 16, 100);
    const innerRingMat = new THREE.MeshPhysicalMaterial({
      color: 0x4488ff,
      metalness: 0.9,
      roughness: 0.1,
      emissive: 0x4488ff,
      emissiveIntensity: 0.2,
    });
    const innerRing = new THREE.Mesh(innerRingGeo, innerRingMat);
    innerRing.rotation.x = Math.PI / 2;
    innerRing.position.y = 0.15;
    scene.add(innerRing);

    // Floating Cubes
    const cubes = [];
    const cubeColors = [0xffcc00, 0x4488ff, 0xff6600, 0x00cc66, 0xff0040];
    for(let i = 0; i < 8; i++) {
      const size = 0.2 + Math.random() * 0.3;
      const geo = new THREE.BoxGeometry(size, size, size);
      const mat = new THREE.MeshPhysicalMaterial({
        color: cubeColors[i % cubeColors.length],
        metalness: 0.9,
        roughness: 0.1,
        emissive: cubeColors[i % cubeColors.length],
        emissiveIntensity: 0.1,
      });
      const cube = new THREE.Mesh(geo, mat);
      const angle = (i / 8) * Math.PI * 2;
      const radius = 1.5 + Math.random() * 1.5;
      cube.position.set(
        Math.cos(angle) * radius,
        0.5 + Math.random() * 0.5,
        Math.sin(angle) * radius
      );
      cube.castShadow = true;
      cube.userData = {
        angle: angle,
        radius: radius,
        speed: 0.5 + Math.random() * 0.5,
        yOffset: 0.5 + Math.random() * 0.5,
        phase: Math.random() * Math.PI * 2
      };
      scene.add(cube);
      cubes.push(cube);
    }

    // Central Logo Cube
    const logoGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
    const logoMat = new THREE.MeshPhysicalMaterial({
      color: 0xffcc00,
      metalness: 0.9,
      roughness: 0.1,
      emissive: 0xffcc00,
      emissiveIntensity: 0.3,
    });
    const logoCube = new THREE.Mesh(logoGeo, logoMat);
    logoCube.position.y = 0.6;
    logoCube.castShadow = true;
    scene.add(logoCube);

    // Outer Ring with dots
    const dotRingGeo = new THREE.TorusGeometry(4.2, 0.02, 16, 60);
    const dotRingMat = new THREE.MeshPhysicalMaterial({
      color: 0xffcc00,
      metalness: 0.9,
      roughness: 0.1,
      emissive: 0xffcc00,
      emissiveIntensity: 0.1,
      transparent: true,
      opacity: 0.5,
    });
    const dotRing = new THREE.Mesh(dotRingGeo, dotRingMat);
    dotRing.rotation.x = Math.PI / 2;
    dotRing.position.y = 0.05;
    scene.add(dotRing);

    // Small dots around ring
    const dots = [];
    for(let i = 0; i < 30; i++) {
      const dotGeo = new THREE.SphereGeometry(0.04, 8, 8);
      const dotMat = new THREE.MeshPhysicalMaterial({
        color: 0xffcc00,
        emissive: 0xffcc00,
        emissiveIntensity: 0.5,
      });
      const dot = new THREE.Mesh(dotGeo, dotMat);
      const angle = (i / 30) * Math.PI * 2;
      dot.position.set(
        Math.cos(angle) * 4.2,
        0.1 + Math.sin(angle * 3) * 0.1,

      );

      scene.add(dot);
      dots.push(dot);

    window.finalizarOS = async function(osId) {
      try {
        const snapshot = await get(ref(database, `ordens/${osId}`));
        const os = snapshot.val();
        
        const confirma = confirm(
          '⚠️ ATENÇÃO TÉCNICO:\n\n' +
          'Para finalizar esta O.S., você precisa confirmar o número do protocolo.\n\n' +
          'Deseja continuar com a finalização?'
        );
        
        if (!confirma) return;
        
        const protocoloInformado = prompt('Digite o número do protocolo da O.S.:');
        if (!protocoloInformado) {
          alert('Operação cancelada.');
          return;
        }
        
        if (parseInt(protocoloInformado) !== os.protocolo) {
          alert('❌ Número de protocolo incorreto!\n\nEntre em contato com a CENTRAL para confirmar o número correto.');
          return;
        }
        
        const tecnicoFinalizacao = prompt('Qual o nome do técnico ou auxiliar técnico que está finalizando o serviço?');
        if (!tecnicoFinalizacao) return;
        
        const pagamentoPrompt = prompt(
          'Qual o status de pagamento?\n\n' +
          '1 - PAGO\n' +
          '2 - GRÁTIS\n' +
          '3 - FALTA PAGAR'
        );
        
        let statusPagamento = null;
        if (pagamentoPrompt === '1') statusPagamento = 'PAGO';
        else if (pagamentoPrompt === '2') statusPagamento = 'GRATIS';
        else if (pagamentoPrompt === '3') statusPagamento = 'FALTA PAGAR';
        else {
          alert('Opção de pagamento inválida!');
          return;
        }
        
        const materiais = prompt('Materiais utilizados:');
        const obsFinais = prompt('Observações finais:');
        
        await update(ref(database, `ordens/${osId}`), {
          status: 'FINALIZADA',

          observacoesFinais: obsFinais || 'Não informado',
          tecnicoFinalizacao: tecnicoFinalizacao,
          statusPagamento: statusPagamento
        });
        
        await addTimeline(osId, `Técnico/Auxiliar finalizando serviço: ${tecnicoFinalizacao}`);
        await addTimeline(osId, `Materiais utilizados: ${materiais || 'N/A'}`);
        await addTimeline(osId, `Status de pagamento: ${statusPagamento}`);
        await addTimeline(osId, `O.S. Finalizada. ${obsFinais || ''}`);
        
        alert('✅ O.S. finalizada com sucesso!');
        
      } catch (error) {
        alert('❌ Erro ao finalizar O.S.');
        console.error(error);
      }
    };

    // ==================== RESTAURAR SESSÃO ====================
    async function restaurarSessao() {
      const sessao = recuperarSessao();
      
      if (sessao) {
        console.log('🔄 Sessão encontrada, restaurando...');
        
        if (sessao.isMaster) {
          await entrarNoSistema(sessao);
          return;
        }
        
        try {
          const snapshot = await get(usersRef);
          const users = snapshot.val() || {};
          const userExists = Object.values(users).some(u => u.usuario === sessao.usuario);
          
          if (userExists) {
            await entrarNoSistema(sessao);
            return;
          } else {
            removerSessao();
            console.log('⚠️ Usuário não existe mais, sessão removida');
          }
        } catch (error) {
          console.error('Erro ao verificar usuário:', error);
          removerSessao();
        }
      }
      
      homeScreen.classList.add('active');
      panelScreen.classList.remove('active');
    }

    // ==================== 3D ANIMATION LOOP ====================
    function animate3d() {
      requestAnimationFrame(animate3d);
      
      const time = Date.now() * 0.001;
      
      // Animate floating cubes
      cubes.forEach((cube, index) => {
        const data = cube.userData;
        cube.position.y = data.yOffset + Math.sin(time * data.speed + data.phase) * 0.3;
        cube.rotation.x = time * data.speed * 0.5;
        cube.rotation.y = time * data.speed * 0.7;
      });
      
      // Animate logo cube
      logoCube.rotation.x = time * 0.5;
      logoCube.rotation.y = time * 0.7;
      logoCube.position.y = 0.6 + Math.sin(time * 0.8) * 0.2;
      
      // Animate rings
      ring.rotation.z = time * 0.1;
      innerRing.rotation.z = -time * 0.15;
      dotRing.rotation.z = time * 0.05;
      
      // Animate dots
      dots.forEach((dot, i) => {
        const angle = dot.userData.angle + time * 0.1;
        dot.position.x = Math.cos(angle) * 4.2;
        dot.position.z = Math.sin(angle) * 4.2;
        dot.position.y = 0.1 + Math.sin(angle * 3 + time * 0.5) * 0.15;
      });
      
      // Animate particles
      particlesMesh.rotation.y = time * 0.02;
      particlesMesh.rotation.x = Math.sin(time * 0.01) * 0.05;
      
      // Pulse point light
      pointLight.intensity = 1 + Math.sin(time * 0.5) * 0.5;
      
      controls.update();
      renderer.render(scene, camera);
    }

    animate3d();

    // ==================== RESIZE ====================
    window.addEventListener('resize', () => {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    });

    // ==================== INIT ====================
    window.addEventListener('load', async () => {
      await restaurarSessao();
    });
  </script>
</body>
</html>
