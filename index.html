<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  
  <title>TOTAL · Central de O.S.</title>
  <meta name="description" content="Sistema de monitoramento e ordens de serviço TOTAL">
  <meta name="theme-color" content="#ffcc00">
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="logo.png">
  <link rel="icon" type="image/png" sizes="512x512" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    }

    html, body {
      height: 100%;
      width: 100%;
      background: #0d0d0d;
      color: #fff;
      overflow: hidden;
      font-size: 18px;
    }

    #app {
      width: 100%;
      height: 100vh;
      max-width: 1400px;
      margin: 0 auto;
      padding: 12px 12px 0 12px;
      display: flex;
      flex-direction: column;
      background: linear-gradient(145deg, #0d0d0d 0%, #1a1a1a 100%);
      overflow: hidden;
    }

    .screen {
      display: none;
      flex-direction: column;
      width: 100%;
      height: 100%;
      animation: fadeIn 0.4s ease;
      overflow: hidden;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #homeScreen {
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 10px 0;
    }

    .login-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .login-logo img {
      max-width: 350px;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 4px 30px rgba(255, 204, 0, 0.2));
      transition: all 0.3s ease;
    }

    .login-logo .logo-sub {
      color: rgba(255,255,255,0.3);
      font-size: 1.1rem;
      letter-spacing: 6px;
      text-transform: uppercase;
    }

    .login-card {
      width: 100%;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 36px 32px;
      border: 1px solid rgba(255, 204, 0, 0.12);
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }

    .login-card h3 {
      color: #ffcc00;
      font-size: 1.6rem;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .login-card input {
      width: 100%;
      padding: 16px 20px;
      margin-bottom: 16px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255, 204, 0, 0.15);
      border-radius: 16px;
      color: #ffcc00;
      font-size: 1.2rem;
      outline: none;
      transition: all 0.3s;
    }

    .login-card input:focus {
      border-color: #ffcc00;
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.05);
    }

    .login-card input::placeholder {
      color: rgba(255,255,255,0.3);
      font-size: 1.1rem;
    }

    .login-card .btn {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      background: linear-gradient(135deg, #ffcc00, #e6b800);
      color: #000;
      font-weight: 700;
      font-size: 1.3rem;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.3s;
      box-shadow: 0 4px 20px rgba(255, 204, 0, 0.15);
    }

    .login-card .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(255, 204, 0, 0.25);
    }

    .login-card .btn:active {
      transform: scale(0.98);
    }

    .login-footer {
      text-align: center;
      padding: 8px 0 4px 0;
      width: 100%;
      margin-top: 4px;
    }

    .login-footer .footer-text {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.35);
      letter-spacing: 1px;
      font-weight: 500;
    }

    .login-footer .footer-text strong {
      color: #ffcc00 !important;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .login-footer .footer-text .code-icon {
      color: rgba(255, 204, 0, 0.2);
      font-size: 0.75rem;
      margin-left: 4px;
    }

    #panelScreen {
      padding: 0;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 4px 12px 4px;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      flex-shrink: 0;
    }

    .panel-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .panel-brand img {
      height: 50px;
      width: auto;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    /* ===== STATUS ONLINE/OFFLINE ===== */
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: all 0.3s;
    }

    .status-badge.online {
      background: rgba(0, 204, 102, 0.12);
      color: #00cc66;
      border: 1px solid rgba(0, 204, 102, 0.2);
    }

    .status-badge.offline {
      background: rgba(255, 68, 68, 0.12);
      color: #ff4444;
      border: 1px solid rgba(255, 68, 68, 0.25);
      animation: pulseOffline 2s infinite;
    }

    .status-badge.pendente-sync {
      background: rgba(255, 204, 0, 0.12);
      color: #ffcc00;
      border: 1px solid rgba(255, 204, 0, 0.25);
    }

    @keyframes pulseOffline {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .status-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      display: inline-block;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .panel-user {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .panel-user .user-info {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ffcc00;
      font-size: 0.95rem;
    }

    .panel-user .user-info i {
      font-size: 1.2rem;
    }

    .panel-user .user-info .badge {
      background: rgba(255, 204, 0, 0.12);
      padding: 4px 14px;
      border-radius: 24px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #ffcc00;
      border: 1px solid rgba(255, 204, 0, 0.08);
    }

    .panel-user .user-info .master-badge {
      background: rgba(255, 0, 0, 0.15);
      color: #ff4444;
      padding: 4px 10px;
      border-radius: 24px;
      font-size: 0.65rem;
      font-weight: 700;
      border: 1px solid rgba(255, 0, 0, 0.1);
    }

    .btn-logout {
      background: transparent;
      color: rgba(255,255,255,0.4);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 8px 16px;
      border-radius: 24px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-logout:hover {
      background: rgba(255,255,255,0.04);
      color: #ffcc00;
      border-color: rgba(255, 204, 0, 0.15);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      width: 100%;
      padding: 14px 0 16px 0;
      flex-shrink: 0;
    }

    .stat-card {
      background: rgba(255,255,255,0.03);
      border-radius: 16px;
      padding: 14px 16px;
      border: 1px solid rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s;
    }

    .stat-card:hover {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255, 204, 0, 0.08);
    }

    .stat-card .icon {
      font-size: 1.4rem;
      color: #ffcc00;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 204, 0, 0.06);
      border-radius: 12px;
    }

    .stat-card .info {
      flex: 1;
      min-width: 0;
    }

    .stat-card .info .label {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .stat-card .info .value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffcc00;
      line-height: 1.2;
    }

    .stat-card.highlight {
      border-color: rgba(255, 204, 0, 0.15);
      background: rgba(255, 204, 0, 0.04);
    }

    .main-content {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .content-card {
      background: rgba(255,255,255,0.03);
      border-radius: 18px;
      padding: 16px 16px 0 16px;
      border: 1px solid rgba(255,255,255,0.04);
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .content-card .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .content-card .card-header h3 {
      color: #ffcc00;
      font-size: 1.2rem;
      font-weight: 600;
    }

    .content-card .card-header .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-left: auto;
    }

    .btn-sm {
      padding: 8px 16px;
      font-size: 0.85rem;
      border-radius: 22px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s;
      font-weight: 600;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ffcc00, #e6b800);
      color: #000;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(255, 204, 0, 0.2);
    }

    .btn-outline {
      background: transparent;
      color: #ffcc00;
      border: 1px solid rgba(255, 204, 0, 0.15);
    }

    .btn-outline:hover {
      background: rgba(255, 204, 0, 0.04);
      border-color: rgba(255, 204, 0, 0.3);
    }

    .os-list {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      padding-bottom: 8px;
    }

    .os-list::-webkit-scrollbar {
      width: 5px;
    }

    .os-list::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.02);
      border-radius: 10px;
    }

    .os-list::-webkit-scrollbar-thumb {
      background: rgba(255, 204, 0, 0.2);
      border-radius: 10px;
    }

    .os-card {
      background: rgba(255,255,255,0.03);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 8px;
      border: 1px solid rgba(255,255,255,0.04);
      transition: all 0.3s;
    }

    .os-card:hover {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255, 204, 0, 0.06);
    }

    .os-card.prioridade-urgente { border-left: 4px solid #ff0040; }
    .os-card.prioridade-alta { border-left: 4px solid #ff6600; }
    .os-card.prioridade-normal { border-left: 4px solid #ffcc00; }
    .os-card.prioridade-baixa { border-left: 4px solid #0066ff; }
    .os-card.minha-os { border-color: rgba(255, 204, 0, 0.25); }

    .os-card.pendente-sync {
      border-color: rgba(255, 204, 0, 0.5) !important;
      background: rgba(255, 204, 0, 0.04);
      position: relative;
    }

    .os-card.pendente-sync::after {
      content: '⏳ Aguardando sync';
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255, 204, 0, 0.15);
      color: #ffcc00;
      font-size: 0.6rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 10px;
      letter-spacing: 0.5px;
    }

    .os-card .os-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      flex-wrap: wrap;
    }

    .os-card .os-title {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .os-card .os-title .codmoni {
      background: rgba(255, 204, 0, 0.08);
      color: #ffcc00;
      padding: 3px 12px;
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 700;
      border: 1px solid rgba(255, 204, 0, 0.06);
    }

    .os-card .os-title .cliente {
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
    }

    .os-card .os-title .star {
      color: #ffcc00;
      font-size: 0.9rem;
    }

    .os-card .os-status {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .badge-status {
      padding: 4px 12px;
      border-radius: 14px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-aberta { background: rgba(255, 102, 0, 0.15); color: #ff6600; }
    .badge-andamento { background: rgba(0, 102, 255, 0.15); color: #0066ff; }
    .badge-pendente { background: rgba(255, 204, 0, 0.15); color: #ffcc00; }
    .badge-finalizada { background: rgba(0, 204, 102, 0.15); color: #00cc66; }

    .badge-pagamento {
      padding: 3px 12px;
      border-radius: 14px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .badge-pago { background: rgba(0, 204, 102, 0.12); color: #00cc66; }
    .badge-gratis { background: rgba(255, 204, 0, 0.12); color: #ffcc00; }
    .badge-falta-pagar { background: rgba(255, 102, 0, 0.12); color: #ff6600; }

    .badge-prioridade {
      padding: 3px 12px;
      border-radius: 14px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .badge-prioridade.urgente { background: rgba(255, 0, 64, 0.15); color: #ff0040; }
    .badge-prioridade.alta { background: rgba(255, 102, 0, 0.15); color: #ff6600; }
    .badge-prioridade.normal { background: rgba(255, 204, 0, 0.15); color: #ffcc00; }
    .badge-prioridade.baixa { background: rgba(0, 102, 255, 0.15); color: #0066ff; }

    .os-card .os-body {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.35);
    }

    .os-card .os-body span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .os-card .os-body span i {
      font-size: 0.75rem;
      width: 16px;
    }

    .os-card .os-observacao {
      margin-top: 8px;
      padding: 8px 12px;
      background: rgba(255, 204, 0, 0.04);
      border-left: 3px solid rgba(255, 204, 0, 0.4);
      border-radius: 8px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.75);
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.4;
    }

    .os-card .os-observacao i {
      color: #ffcc00;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .os-card .os-actions {
      margin-top: 10px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .os-card .os-actions .btn-xs {
      padding: 5px 12px;
      font-size: 0.75rem;
      border-radius: 14px;
      border: 1px solid rgba(255, 204, 0, 0.08);
      background: transparent;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 500;
    }

    .os-card .os-actions .btn-xs:hover {
      background: rgba(255, 204, 0, 0.04);
      color: #ffcc00;
      border-color: rgba(255, 204, 0, 0.15);
    }

    .os-card .os-actions .btn-xs.danger:hover {
      color: #ff4444;
      border-color: rgba(255, 68, 68, 0.15);
    }

    .os-card .os-actions .btn-xs.btn-prioridade {
      border-color: rgba(255, 204, 0, 0.2);
      color: #ffcc00;
    }

    .os-card .os-actions .btn-xs.btn-prioridade:hover {
      background: rgba(255, 204, 0, 0.08);
    }

    .os-card .timeline {
      margin-top: 10px;
      padding: 10px 12px;
      background: rgba(0,0,0,0.2);
      border-radius: 10px;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.35);
      max-height: 300px;
      overflow-y: auto;
      border-left: 2px solid rgba(255, 204, 0, 0.1);
    }

    .os-card .timeline.timeline-infinito {
      max-height: none;
      overflow-y: visible;
    }

    .os-card .timeline div {
      margin-top: 3px;
      padding: 2px 0;
      border-bottom: 1px solid rgba(255,255,255,0.02);
    }

    .os-card .timeline div:last-child {
      border-bottom: none;
    }

    .os-card .timeline .time {
      color: rgba(255, 204, 0, 0.3);
      font-weight: 600;
    }

    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: rgba(20, 20, 30, 0.95);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-top: 1px solid rgba(255, 204, 0, 0.1);
      padding: 10px 0 16px 0;
      flex-shrink: 0;
      margin: 0 -12px;
      padding-left: 12px;
      padding-right: 12px;
      border-radius: 24px 24px 0 0;
      position: relative;
      z-index: 10;
      min-height: 80px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 6px 12px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.25);
      position: relative;
      min-width: 60px;
      flex: 1;
      border-radius: 16px;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-item::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 50%;
      transform: translateX(-50%) scaleX(0);
      width: 28px;
      height: 4px;
      background: #ffcc00;
      border-radius: 6px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .nav-item.active {
      color: #ffcc00;
    }

    .nav-item.active::after {
      transform: translateX(-50%) scaleX(1);
    }

    .nav-item .nav-icon {
      font-size: 1.6rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      line-height: 1;
    }

    .nav-item.active .nav-icon {
      transform: translateY(-3px) scale(1.15);
    }

    .nav-item .nav-label {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: all 0.3s;
      line-height: 1.2;
    }

    .nav-item.active .nav-label {
      color: #ffcc00;
      font-weight: 700;
    }

    .nav-item .nav-badge {
      position: absolute;
      top: -2px;
      right: 2px;
      background: #ff0040;
      color: #fff;
      font-size: 0.55rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 14px;
      min-width: 20px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(255, 0, 64, 0.4);
      animation: badgePulse 2s ease-in-out infinite;
    }

    @keyframes badgePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: rgba(255,255,255,0.15);
    }

    .empty-state i {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 12px;
      color: rgba(255, 204, 0, 0.08);
    }

    .empty-state p {
      font-size: 1rem;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #ffcc00;
      font-size: 1.1rem;
    }

    .loading i {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none !important;
    }

    .os-check {
      width: 18px;
      height: 18px;
      accent-color: #ffcc00;
      cursor: pointer;
      margin-right: 6px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px 16px;

    /* ===== TOAST DE NOTIFICAÇÃO ===== */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(20, 20, 30, 0.98);
      border: 1px solid rgba(255, 204, 0, 0.3);
      color: #fff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      z-index: 9999;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      max-width: 90%;
      text-align: center;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.success { border-color: rgba(0, 204, 102, 0.4); color: #00cc66; }
    .toast.warn { border-color: rgba(255, 204, 0, 0.4); color: #ffcc00; }
    .toast.error { border-color: rgba(255, 68, 68, 0.4); color: #ff4444; }

  <script>
    // ==================== SERVICE WORKER ROBUSTO COM OFFLINE ====================
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          const CACHE_NAME = 'total-v3';
          const APP_SHELL = [
            './',
            './index.html',
            './logo.png',
            './manifest.json'
          ];

          self.addEventListener('install', (event) => {
            event.waitUntil(
              caches.open(CACHE_NAME).then((cache) => {
                console.log('[SW] Pre-cacheando app shell');
                return cache.addAll(APP_SHELL).catch((err) => {
                  console.warn('[SW] Falha ao cachear alguns recursos:', err);
                });
              }).then(() => self.skipWaiting())
            );
          });

          self.addEventListener('activate', (event) => {
            event.waitUntil(
              caches.keys().then((keys) => {
                return Promise.all(
                  keys.filter((key) => key !== CACHE_NAME).map((key) => caches.delete(key))
                );
              }).then(() => self.clients.claim())
            );
          });

          self.addEventListener('fetch', (event) => {
            const req = event.request;
            const url = new URL(req.url);

            if (url.hostname.includes('firebase') || 
                url.hostname.includes('firebaseio') ||
                url.hostname.includes('googleapis') ||
                url.hostname.includes('gstatic') && url.pathname.includes('firebase') ||
                req.method !== 'GET') {
              return;
            }

            if (url.hostname.includes('cdnjs.cloudflare.com') ||
                url.hostname.includes('cdn.jsdelivr.net')) {
              event.respondWith(
                caches.match(req).then((cached) => {
                  return cached || fetch(req).then((res) => {
                    const copy = res.clone();
                    caches.open(CACHE_NAME).then((cache) => cache.put(req, copy));
                    return res;
                  }).catch(() => cached);
                })
              );
              return;
            }

            event.respondWith(
              fetch(req).then((res) => {
                if (res && res.status === 200 && req.method === 'GET') {
                  const copy = res.clone();
                  caches.open(CACHE_NAME).then((cache) => cache.put(req, copy));
                }
                return res;
              }).catch(() => {
                return caches.match(req).then((cached) => {
                  if (cached) return cached;
                  if (req.mode === 'navigate') {
                    return caches.match('./index.html');
                  }
                });
              })
            );
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).then((reg) => {
          console.log('✅ Service Worker registrado:', reg.scope);
        }).catch((err) => {
          console.warn('⚠️ Service Worker falhou:', err);
        });
      });
    }

    function removerSessao() {
      try { localStorage.removeItem('total_user_session'); } catch (e) {}
    }
    function recuperarSessao() {
      try {
        const data = localStorage.getItem('total_user_session');
        if (data) return JSON.parse(data);
      } catch (e) {}
      return null;
    }

    // ==================== CACHE LOCAL DE ORDENS ====================
    function salvarOrdensCache(ordens) {
      try {
        localStorage.setItem('total_ordens_cache', JSON.stringify(ordens));
        localStorage.setItem('total_ordens_cache_ts', Date.now().toString());
      } catch (e) {
        console.warn('Erro ao salvar cache de ordens:', e);
      }
    }

    function carregarOrdensCache() {
      try {
        const data = localStorage.getItem('total_ordens_cache');
        if (data) return JSON.parse(data);
      } catch (e) {}
      return [];
    }

    // ==================== FILA DE SINCRONIZAÇÃO ====================
    function getFila() {
      try {
        const data = localStorage.getItem('total_fila_sync');
        if (data) return JSON.parse(data);
      } catch (e) {}
      return [];
    }

    function salvarFila(fila) {
      try {
        localStorage.setItem('total_fila_sync', JSON.stringify(fila));
        atualizarBadgePendentesSync();
      } catch (e) {}
    }

    function adicionarNaFila(acao) {
      const fila = getFila();
      acao._id = 'sync_' + Date.now() + '_' + Math.random().toString(36).slice(2, 9);
      acao._timestamp = Date.now();
      fila.push(acao);
      salvarFila(fila);
      console.log('📥 Ação adicionada na fila:', acao.tipo);
      return acao._id;
    }

    function removerDaFila(syncId) {
      const fila = getFila().filter(a => a._id !== syncId);
      salvarFila(fila);
    }

    function atualizarBadgePendentesSync() {
      const pendentes = getFila().length;
      const badge = document.getElementById('badgeSyncCount');
      if (badge) {
        if (pendentes > 0) {
          badge.textContent = pendentes;
          badge.style.display = 'flex';
        } else {
          badge.style.display = 'none';
        }
      }
    }

    function aplicarAcaoLocal(acao) {
      let ordens = carregarOrdensCache();
      
      switch(acao.tipo) {
        case 'CRIAR_OS': {
          const novaOS = {
            id: acao._id,
            ...acao.dados,
            _pendenteSync: true
          };
          ordens.push(novaOS);
          break;
        }
        case 'UPDATE_OS': {
          ordens = ordens.map(o => {
            if (o.id === acao.osId) {
              return { ...o, ...acao.dados, _pendenteSync: true };
            }
            return o;
          });
          break;
        }
        case 'DELETE_OS': {
          ordens = ordens.filter(o => o.id !== acao.osId);
          break;
        }
      }
      
      salvarOrdensCache(ordens);
      ordensCacheLocal = ordens;
      return ordens;
    }

    async function processarFila() {
      if (!isOnline) return;
      const fila = getFila();
      if (fila.length === 0) return;

      console.log('🔄 Processando fila de sincronização...', fila.length, 'itens');
      showToast('<i class="fas fa-sync fa-spin"></i> Sincronizando ' + fila.length + ' ação(ões)...', 'warn', 4000);

      let sucesso = 0;
      let falha = 0;

      for (const acao of fila) {
        try {
          if (acao.tipo === 'CRIAR_OS') {
            const novaRef = push(ordensRef);
            await set(novaRef, acao.dados);
            let ordens = carregarOrdensCache().filter(o => o.id !== acao._id);
            salvarOrdensCache(ordens);
            ordensCacheLocal = ordens;
            sucesso++;
          } else if (acao.tipo === 'UPDATE_OS') {
            await update(ref(database, `ordens/${acao.osId}`), acao.dados);
            let ordens = carregarOrdensCache().map(o => {
              if (o.id === acao.osId) {
                const { _pendenteSync, ...resto } = o;
                return resto;
              }
              return o;
            });
            salvarOrdensCache(ordens);
            ordensCacheLocal = ordens;
            sucesso++;
          } else if (acao.tipo === 'DELETE_OS') {
            await remove(ref(database, `ordens/${acao.osId}`));
            sucesso++;
          }
          removerDaFila(acao._id);
        } catch (err) {
          console.warn('❌ Falha ao sincronizar:', acao.tipo, err);
          falha++;
          if (!navigator.onLine) break;
        }
      }

      if (sucesso > 0 && falha === 0) {
        showToast('<i class="fas fa-check-circle"></i> ' + sucesso + ' ação(ões) sincronizada(s)!', 'success', 3000);
      } else if (sucesso > 0 && falha > 0) {
        showToast('<i class="fas fa-exclamation-triangle"></i> ' + sucesso + ' ok, ' + falha + ' falharam', 'warn', 4000);
      }

      if (window.ordensLista && currentUser) {
        renderPanelView();
      }
    }

    // ==================== STATUS ONLINE/OFFLINE ====================
    function atualizarStatusConexao() {
      isOnline = navigator.onLine;
      
      if (!statusBadge) return;
      
      const filaPendente = getFila().length;
      
      if (!isOnline) {
        statusBadge.className = 'status-badge offline';
        statusBadge.innerHTML = '<span class="dot"></span> Offline' + (filaPendente > 0 ? ` · ${filaPendente} pend.` : '');
      } else if (filaPendente > 0) {
        statusBadge.className = 'status-badge pendente-sync';
        statusBadge.innerHTML = `<i class="fas fa-sync"></i> Sincronizando (${filaPendente})`;
      } else {
        statusBadge.className = 'status-badge online';
        statusBadge.innerHTML = '<span class="dot"></span> Online';
      }
    }

    window.addEventListener('online', () => {
      console.log('🌐 Conexão restaurada');
      atualizarStatusConexao();
      setTimeout(() => processarFila(), 800);
    });

    window.addEventListener('offline', () => {
      console.log('📴 Sem conexão');
      atualizarStatusConexao();
      showToast('<i class="fas fa-wifi"></i> Modo offline ativado. Suas ações serão sincronizadas.', 'warn', 5000);
    });

    setInterval(async () => {
      if (!currentUser) return;
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 3000);
        await fetch('https://www.gstatic.com/generate_204', { 
          method: 'HEAD', 
          mode: 'no-cors',
          signal: controller.signal,
          cache: 'no-store'
        });
        clearTimeout(timeout);
        if (!isOnline) {
          isOnline = true;
          atualizarStatusConexao();
          setTimeout(() => processarFila(), 500);
        } else {
          atualizarStatusConexao();
        }
      } catch (e) {
        if (isOnline) {
          isOnline = false;
          atualizarStatusConexao();
        }
      }
    }, 20000);

    // ==================== LOGIN ====================
    document.getElementById('btnLoginExec').addEventListener('click', async () => {
      const usuario = document.getElementById('loginUser').value.trim().toUpperCase();
      const senha = document.getElementById('loginPass').value.trim();
      
      if (!usuario || !senha) {
        showToast('⚠️ Preencha usuário e senha!', 'warn');
        return;
      }
      
      if (!navigator.onLine) {
        const sessao = recuperarSessao();
        if (sessao && sessao.usuario === usuario && sessao.senha === senha) {
          await entrarNoSistema(sessao);
          showToast('<i class="fas fa-wifi"></i> Login offline (sessão salva)', 'warn', 3000);
          return;
        }
        try {
          const usersCache = JSON.parse(localStorage.getItem('total_users_cache') || '{}');
          const found = Object.values(usersCache).find(u => u.usuario === usuario && u.senha === senha);
          if (found) {
            salvarSessao(found);
            await entrarNoSistema(found);
            showToast('<i class="fas fa-wifi"></i> Login offline (cache)', 'warn', 3000);
            return;
          }
        } catch (e) {}
        showToast('❌ Sem conexão. Faça login quando estiver online.', 'error', 5000);
        return;
      }
      
      try {
        const snapshot = await get(usersRef);
        const users = snapshot.val() || {};
        
        try { localStorage.setItem('total_users_cache', JSON.stringify(users)); } catch (e) {}
        
        let found = null;
        if (usuario === 'IRLAN' && senha === '4747') {
          found = { usuario: 'IRLAN', senha: '4747', funcao: 'Gestor', isMaster: true };
        } else {
          found = Object.values(users).find(u => u.usuario === usuario && u.senha === senha);
        }
        
        if (!found) {
          showToast('❌ Credenciais inválidas!', 'error');
          return;
        }
        
        salvarSessao(found);
        await entrarNoSistema(found);
        
      } catch (error) {
        const sessao = recuperarSessao();
        if (sessao && sessao.usuario === usuario) {
          await entrarNoSistema(sessao);
          showToast('Login offline pela sessão', 'warn');
          return;
        }
        showToast('❌ Erro ao conectar. Verifique a internet.', 'error');
        console.error(error);
      }
    });

    document.getElementById('loginPass').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('btnLoginExec').click();
    });
    document.getElementById('loginUser').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('loginPass').focus();
    });

    // ==================== ENTRAR ====================

    document.getElementById('btnLogout').addEventListener('click', () => {
      if (ordensListener) {
        off(ordensRef, 'value', ordensListener);
        ordensListener = null;
      }
      currentUser = null;
      abaAtual = 'minhas';
      removerSessao();

      homeScreen.classList.add('active');
      dashboardArea.style.display = '';

    // ==================== DASHBOARD ====================
    function atualizarDashboard(ordens) {
      const abertas = ordens.filter(o => o.status === 'ABERTA').length;
      const andamento = ordens.filter(o => o.status === 'EM ANDAMENTO').length;
      const pendentes = ordens.filter(o => o.status === 'PENDENTE').length;
      const finalizadas = ordens.filter(o => o.status === 'FINALIZADA').length;
      const tecnicosUnicos = [...new Set(ordens.filter(o => o.tecnico && o.status === 'EM ANDAMENTO').map(o => o.tecnico))];
      const tecEmAtend = tecnicosUnicos.length;
      
      let minhasOS = 0;
      if (currentUser) {
        if (currentUser.funcao === 'Operador') {
          minhasOS = ordens.filter(o => o.operador === currentUser.usuario && o.status !== 'FINALIZADA').length;
        } else if (currentUser.funcao === 'Tecnico') {
          minhasOS = ordens.filter(o => o.tecnico === currentUser.usuario && o.status !== 'FINALIZADA').length;
        } else if (currentUser.funcao === 'Gestor' || isMaster()) {
          minhasOS = ordens.filter(o => o.status !== 'FINALIZADA').length;
        }
      }
      
      const cards = dashboardArea.querySelectorAll('.stat-card');
      if (cards.length >= 6) {
        cards[0].querySelector('.value').textContent = abertas;
        cards[1].querySelector('.value').textContent = andamento;
        cards[2].querySelector('.value').textContent = pendentes;
        cards[3].querySelector('.value').textContent = finalizadas;
        cards[4].querySelector('.value').textContent = tecEmAtend;
        cards[5].querySelector('.value').textContent = minhasOS;
      }
    }

    function mesclarOrdens(ordensFirebase) {
      const pendentes = carregarOrdensCache().filter(o => o._pendenteSync);
      const codigosFirebase = new Set(ordensFirebase.map(o => o.codMoni));
      const pendentesUnicas = pendentes.filter(p => !codigosFirebase.has(p.codMoni));
      return [...ordensFirebase, ...pendentesUnicas];
    }

    async function renderPanel() {
      if (!currentUser) return;
      
      profileContent.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i> Carregando dados...</div>';
      
      const cached = carregarOrdensCache();
      if (cached.length > 0) {
        ordensCacheLocal = cached;
        window.ordensLista = cached;
        atualizarDashboard(cached);
        setupBottomNav(cached);
        controlarVisibilidadeDashboard();
        renderPanelView();
      }
      
      if (ordensListener) {
        off(ordensRef, 'value', ordensListener);
      }
      
      ordensListener = onValue(ordensRef, (snapshot) => {
        const ordensData = snapshot.val() || {};
        const ordensList = Object.entries(ordensData).map(([key, value]) => ({
          id: key,
          ...value
        }));
        
        const cacheLimpo = ordensList.filter(o => !o._pendenteSync);
        salvarOrdensCache(cacheLimpo);
        
        const mescladas = mesclarOrdens(ordensList);
        ordensCacheLocal = mescladas;
        window.ordensLista = mescladas;
        
        atualizarDashboard(mescladas);
        setupBottomNav(mescladas);
        controlarVisibilidadeDashboard();
        renderPanelView();
        
        // Se a tela expandida estiver aberta, atualiza em tempo real
        if (osDetalheAbertoId) {
          const ainda = mescladas.find(o => o.id === osDetalheAbertoId);
          if (ainda) {
            renderDetalhesConteudo(ainda);
          } else {
            // O.S. foi removida
            osDetailScreen.classList.remove('active');
            osDetalheAbertoId = null;
          }
        }
      }, (error) => {
        console.warn('⚠️ Firebase offline - usando cache local:', error);
        if (ordensCacheLocal.length > 0) {
          window.ordensLista = ordensCacheLocal;
          atualizarDashboard(ordensCacheLocal);
          setupBottomNav(ordensCacheLocal);
          controlarVisibilidadeDashboard();
          renderPanelView();
        }
      });
    }

    function renderPanelView() {
      if (!currentUser) return;
      const ordens = window.ordensLista || [];
      
      if (isMaster()) {
        renderGestor(ordens, true);
      } else if (currentUser.funcao === 'Operador') {
        renderOperador(ordens);
      } else if (currentUser.funcao === 'Gestor') {
        renderGestor(ordens, false);
      } else if (currentUser.funcao === 'Tecnico') {
        renderTecnico(ordens);
      }
    }

    // ==================== ADD TIMELINE ====================
    async function addTimeline(ordemId, texto) {
      const ordemRef = ref(database, `ordens/${ordemId}/timeline`);
      const snapshot = await get(ordemRef);
      let timeline = snapshot.val() || [];
      if (!Array.isArray(timeline)) timeline = [];
      
      timeline.push({ 
        hora: getNow().hora, 
        texto: texto,
        data: getNow().data,
        timestamp: Date.now()
      });
      
      await set(ordemRef, timeline);
    }

    function addTimelineLocal(ordens, osId, texto) {
      return ordens.map(o => {
        if (o.id === osId) {
          const timeline = Array.isArray(o.timeline) ? o.timeline : [];
          return {
            ...o,
            timeline: [...timeline, {
              hora: getNow().hora,
              texto,
              data: getNow().data,
              timestamp: Date.now()
            }]
          };
        }
        return o;
      });
    }

    async function executarUpdate(osId, dados, timelineTexto) {
      let ordens = carregarOrdensCache();
      ordens = ordens.map(o => o.id === osId ? { ...o, ...dados } : o);
      if (timelineTexto) {
        ordens = addTimelineLocal(ordens, osId, timelineTexto);
      }
      salvarOrdensCache(ordens);
      ordensCacheLocal = ordens;
      window.ordensLista = mesclarOrdens((window.ordensLista || []).filter(o => !o._pendenteSync));
      
      atualizarDashboard(window.ordensLista);
      setupBottomNav(window.ordensLista);
      renderPanelView();
      
      // Atualiza a tela expandida se estiver aberta
      if (osDetalheAbertoId === osId) {
        const atualizada = (window.ordensLista || []).find(o => o.id === osId);
        if (atualizada) renderDetalhesConteudo(atualizada);
      }
      
      if (navigator.onLine) {
        try {
          await update(ref(database, `ordens/${osId}`), dados);
          if (timelineTexto) {
            await addTimeline(osId, timelineTexto);
          }
          return { ok: true, offline: false };
        } catch (err) {
          console.warn('Falha no envio direto, adicionando na fila:', err);
        }
      }
      
      adicionarNaFila({ tipo: 'UPDATE_OS', osId, dados });
      return { ok: true, offline: true };
    }

            <span>Minhas (${minhas})</span>
          </button>
          <button class="tec-filtro ${abaAtual === 'abertas' ? 'active' : ''}" data-tec-tab="abertas">
            <i class="fas fa-folder-open"></i>
            <span>Livres (${abertas})</span>
          </button>
          <button class="tec-filtro ${abaAtual === 'andamento' ? 'active' : ''}" data-tec-tab="andamento">
            <i class="fas fa-play-circle"></i>
            <span>Em rota (${andamento})</span>
          </button>
        </div>
        
        <div class="os-list" id="listaTecnico"></div>
      `;
      
      profileContent.querySelectorAll('.tec-filtro').forEach(btn => {
        btn.onclick = () => {
          abaAtual = btn.dataset.tecTab;
          profileContent.querySelectorAll('.tec-filtro').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          
          document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
          const navEquiv = document.querySelector(`.nav-item[data-tab="${abaAtual}"]`);
          if (navEquiv) navEquiv.classList.add('active');
          
          listarOrdensTecnico(window.ordensLista || []);
        };
      });
      
      setTimeout(() => listarOrdensTecnico(ordens), 30);
    }

    // ==================== BUSCAR OU ABRIR O.S. ====================
    async function buscarOuAbrirOS(ordens) {
      const cod = document.getElementById('codMoniInput').value.trim();
      if (!cod) {
        showToast('Informe o código MONI', 'warn');
        return;
      }
      
      const existente = ordens.find(o => o.codMoni === cod && o.status !== 'FINALIZADA');
      const novaDiv = document.getElementById('novaOsForm');
      const msgDiv = document.getElementById('osExistenteMsg');
      
      if (existente) {
        msgDiv.classList.remove('hidden');
        msgDiv.innerHTML = `
          <div style="background:rgba(255,204,0,0.04);border:1px solid rgba(255,204,0,0.08);border-radius:14px;padding:16px;margin-bottom:16px;">
            <i class="fas fa-exclamation-triangle" style="color:#ffcc00;font-size:1.2rem;"></i>
            <strong style="color:#ffcc00;font-size:1.1rem;">Já existe O.S. aberta para este Código MONI</strong><br>
            <span style="color:rgba(255,255,255,0.5);font-size:1rem;">
              Operador: ${escaparHTML(existente.operador)}<br>
              Data: ${escaparHTML(existente.dataAbertura)} | Hora: ${escaparHTML(existente.horaAbertura)}<br>
              Status: <span class="badge-status ${getStatusBadgeClass(existente.status)}">${escaparHTML(existente.status)}</span>
            </span>
            <br>
            <button class="btn-sm btn-outline" id="btnCancelarExistente" style="margin-top:10px;">Cancelar</button>
          </div>`;
        
        document.getElementById('btnCancelarExistente').addEventListener('click', () => {
          msgDiv.classList.add('hidden');
        });
        novaDiv.classList.add('hidden');
      } else {
        msgDiv.classList.add('hidden');
        novaDiv.classList.remove('hidden');
        novaDiv.innerHTML = `
          <div class="form-card">
            <h4><i class="fas fa-plus-circle"></i> Nova Ordem de Serviço</h4>
            <div class="form-group">
              <input type="text" id="nomeCliente" placeholder="Nome do Cliente">
            </div>
            <div class="form-group">
              <textarea id="obsAbertura" placeholder="Observação" rows="2"></textarea>
            </div>
            <button class="btn-salvar-os" id="btnSalvarOS">
              <i class="fas fa-save"></i> Salvar O.S.
            </button>
          </div>`;
        
        document.getElementById('btnSalvarOS').addEventListener('click', async () => {
          const cliente = document.getElementById('nomeCliente').value.trim();
          const obs = document.getElementById('obsAbertura').value.trim();
          
          if (!cliente) {
            showToast('⚠️ Nome do cliente é obrigatório!', 'warn');
            return;
          }
          
          const { data, hora } = getNow();
          
          const novaOS = {
            codMoni: cod,
            cliente,
            endereco: 'Não informado',
            observacao: obs || '',
            operador: currentUser.usuario,
            dataAbertura: data,
            horaAbertura: hora,
            status: 'ABERTA',
            prioridade: null,
            tecnico: null,
            statusPagamento: null,
            tecnicoInicio: null,
            tecnicoFinalizacao: null,
            timeline: [{ hora, texto: `📋 Operador ${currentUser.usuario} abriu a O.S.` }]
          };
          
          if (navigator.onLine) {
            try {
              await push(ordensRef, novaOS);
              novaDiv.classList.add('hidden');
              document.getElementById('codMoniInput').value = '';
              showToast('✅ O.S. aberta com sucesso!', 'success');
              return;
            } catch (err) {
              console.warn('Falha ao enviar, vai pra fila:', err);
            }
          }
          
          adicionarNaFila({ tipo: 'CRIAR_OS', dados: novaOS });
          aplicarAcaoLocal({ tipo: 'CRIAR_OS', dados: novaOS, _id: getFila()[getFila().length - 1]._id });
          
          novaDiv.classList.add('hidden');
          document.getElementById('codMoniInput').value = '';
          atualizarBadgePendentesSync();
          
          if (navigator.onLine) {
            showToast('⏳ O.S. salva. Sincronizando...', 'warn');
            setTimeout(() => processarFila(), 500);
          } else {
            showToast('📴 O.S. salva offline. Será sincronizada quando voltar a conexão.', 'warn', 4000);
          }
        });
      }
    }

    // ==================== AÇÕES GLOBAIS ====================
    window.reabrirOS = async function(osId) {
      if (!confirm('⚠️ Deseja reabrir esta O.S. finalizada?\n\n📌 Todo o histórico anterior será mantido.')) return;
      
      const { data, hora } = getNow();
      const dados = {
        status: 'ABERTA',
        dataReabertura: data,
        horaReabertura: hora
      };
      
      const timelineTexto = `🔄 O.S. reaberta por ${currentUser.usuario} em ${data} às ${hora}`;
      
      const result = await executarUpdate(osId, dados, timelineTexto);
      
      if (result.offline) {
        showToast('📴 Reaberta offline. Sincroniza quando conectar.', 'warn', 3500);
      } else {
        showToast('✅ O.S. reaberta com sucesso!', 'success');
      }
    };

    window.assumirOS = async function(osId) {
      const os = (window.ordensLista || []).find(o => o.id === osId);
      if (!os) return;
      
      if (os.tecnico && os.tecnico !== currentUser.usuario) {
        showToast('⚠️ Esta O.S. já está com outro técnico!', 'error');
        return;
      }
      
      const tecnicoInicio = prompt('Qual o nome do técnico ou auxiliar técnico que está iniciando o serviço?');
      if (!tecnicoInicio) return;
      
      const dados = {
        tecnico: currentUser.usuario,
        status: 'EM ANDAMENTO',
        tecnicoInicio: tecnicoInicio
      };
      
      const timelineTexto = `👨‍🔧 Técnico ${currentUser.usuario} assumiu o atendimento | Iniciando: ${tecnicoInicio}`;
      
      const result = await executarUpdate(osId, dados, timelineTexto);
      
      if (result.offline) {
        showToast('📴 O.S. assumida offline. Sincroniza automaticamente.', 'warn', 3500);
      } else {
        showToast('✅ O.S. assumida com sucesso!', 'success');
      }
    };

    window.finalizarOS = async function(osId) {
      if (!confirm('⚠️ Confirmar finalização da O.S.?')) return;
      
      const tecnicoFinal = prompt('Nome do técnico/auxiliar finalizando:');
      if (!tecnicoFinal) return;
      
      const pagamento = prompt('Pagamento (1-PAGO, 2-GRÁTIS, 3-FALTA PAGAR):');
      let statusPagamento = null;
      if (pagamento === '1') statusPagamento = 'PAGO';
      else if (pagamento === '2') statusPagamento = 'GRATIS';
      else if (pagamento === '3') statusPagamento = 'FALTA PAGAR';
      else { showToast('Opção inválida!', 'error'); return; }
      
      const materiais = prompt('Materiais utilizados:');
      const obsFinais = prompt('Observações finais:');
      
      const dados = {
        status: 'FINALIZADA',
        materiaisUtilizados: materiais || 'Não informado',
        observacoesFinais: obsFinais || 'Não informado',
        tecnicoFinalizacao: tecnicoFinal,
        statusPagamento: statusPagamento
      };
      
      const timelineTexto = `✅ Finalizando: ${tecnicoFinal} | Materiais: ${materiais || 'N/A'} | Pagamento: ${statusPagamento}`;
      
      const result = await executarUpdate(osId, dados, timelineTexto);
      
      if (result.offline) {
        showToast('📴 O.S. finalizada offline. Sincroniza quando conectar.', 'warn', 3500);
      } else {
        showToast('✅ O.S. finalizada com sucesso!', 'success');
      }
    };

    window.pendenteOS = async function(osId) {
      const motivo = prompt('Motivo da pendência:');
      if (!motivo) return;
      
      const dados = { status: 'PENDENTE' };
      const timelineTexto = `⏸️ Status alterado para PENDENTE - Motivo: ${motivo}`;
      
      const result = await executarUpdate(osId, dados, timelineTexto);
      
      if (result.offline) {
        showToast('📴 O.S. marcada como pendente offline.', 'warn', 3500);
      } else {
        showToast('✅ O.S. pendente!', 'success');
      }
    };

    window.transferirOS = async function(osId) {
      const novo = prompt('Nome do novo técnico:');
      if (!novo) return;
      
      const dados = { tecnico: novo };
      const timelineTexto = `🔄 Gestor transferiu O.S. para ${novo}`;
      
      const result = await executarUpdate(osId, dados, timelineTexto);
      
      if (result.offline) {
        showToast('📴 Transferência offline.', 'warn', 3000);
      } else {
        showToast('✅ Transferida!', 'success');
      }
    };

    window.alterarStatusOS = async function(osId) {
      const status = prompt('Novo status (ABERTA, EM ANDAMENTO, PENDENTE, FINALIZADA):');
      if (!status) return;
      const validos = ['ABERTA', 'EM ANDAMENTO', 'PENDENTE', 'FINALIZADA'];
      if (!validos.includes(status.toUpperCase())) {
        showToast('Status inválido!', 'error');
        return;
      }
      
      const dados = { status: status.toUpperCase() };
      const timelineTexto = `📌 Gestor alterou status para ${status.toUpperCase()}`;
      
      const result = await executarUpdate(osId, dados, timelineTexto);
      
      showToast(result.offline ? '📴 Alterado offline.' : '✅ Status alterado!', result.offline ? 'warn' : 'success');
    };

    window.editarOS = async function(osId) {
      const os = (window.ordensLista || []).find(o => o.id === osId);
      if (!os) { showToast('O.S. não encontrada!', 'error'); return; }
      
      const cliente = prompt('Cliente:', os.cliente) || os.cliente;
      const endereco = prompt('Endereço:', os.endereco || '') || os.endereco || 'Não informado';
      const obs = prompt('Observação:', os.observacao || '') || os.observacao || '';
      
      const dados = { cliente, endereco, observacao: obs };
      const timelineTexto = '✏️ Gestor editou informações da O.S.';
      
      const result = await executarUpdate(osId, dados, timelineTexto);
      
      showToast(result.offline ? '📴 Editado offline.' : '✅ Editada!', result.offline ? 'warn' : 'success');
    };

    window.removerOS = async function(osId) {
      if (!isMaster()) { showToast('Apenas Master pode excluir!', 'error'); return; }
      if (!confirm('⚠️ Excluir permanentemente esta O.S.?')) return;
      
      if (navigator.onLine) {
        try {
          await remove(ref(database, `ordens/${osId}`));
          showToast('✅ Excluída!', 'success');
          osDetailScreen.classList.remove('active');
          osDetalheAbertoId = null;
          return;
        } catch (err) {
          console.warn('Falha ao excluir online:', err);
        }
      }
      
      adicionarNaFila({ tipo: 'DELETE_OS', osId });
      showToast('📴 Exclusão na fila.', 'warn');
      osDetailScreen.classList.remove('active');
      osDetalheAbertoId = null;
    };

    window.definirPrioridadeOS = async function(osId) {
      const opcao = prompt(
        '🏷️ Defina a prioridade:\n\n' +
        '1 - 🔴 Urgente\n' +
        '2 - 🟠 Alta\n' +
        '3 - 🟡 Normal\n' +
        '4 - 🔵 Baixa\n' +
        '0 - ⚪ Remover prioridade\n\n' +
        'Digite o número:'
      );
      
      if (opcao === null) return;
      
      let novaPrioridade = null;
      if (opcao === '1') novaPrioridade = '🔴 Urgente';
      else if (opcao === '2') novaPrioridade = '🟠 Alta';
      else if (opcao === '3') novaPrioridade = '🟡 Normal';
      else if (opcao === '4') novaPrioridade = '🔵 Baixa';
      else if (opcao === '0') novaPrioridade = null;
      else { showToast('Opção inválida!', 'error'); return; }
      
      const dados = { prioridade: novaPrioridade };
      const timelineTexto = novaPrioridade ? `🏷️ Gestor definiu prioridade: ${novaPrioridade}` : '🏷️ Gestor removeu a prioridade';
      
      const result = await executarUpdate(osId, dados, timelineTexto);
      
      showToast(
        result.offline ? '📴 Prioridade salva offline.' : (novaPrioridade ? `✅ Prioridade: ${novaPrioridade}` : '✅ Prioridade removida!'),
        result.offline ? 'warn' : 'success'
      );
    };

    async function definirPrioridade(ordens) {
      const checks = [...document.querySelectorAll('.os-check:checked')].map(c => c.value);
      if (!checks.length) { showToast('Selecione pelo menos uma O.S.', 'warn'); return; }
      
      const opcao = prompt(
        `🏷️ Definir prioridade para ${checks.length} O.S. selecionada(s):\n\n` +
        '1 - 🔴 Urgente\n' +
        '2 - 🟠 Alta\n' +
        '3 - 🟡 Normal\n' +
        '4 - 🔵 Baixa\n' +
        '0 - ⚪ Remover prioridade'
      );
      
      if (opcao === null) return;
      
      let novaPrioridade = null;
      if (opcao === '1') novaPrioridade = '🔴 Urgente';
      else if (opcao === '2') novaPrioridade = '🟠 Alta';
      else if (opcao === '3') novaPrioridade = '🟡 Normal';
      else if (opcao === '4') novaPrioridade = '🔵 Baixa';
      else if (opcao === '0') novaPrioridade = null;
      else { showToast('Opção inválida!', 'error'); return; }
      
      const timelineTexto = novaPrioridade 
        ? `🏷️ Prioridade definida em lote: ${novaPrioridade}` 
        : '🏷️ Prioridade removida em lote';
      
      let algumOffline = false;
      for (const osId of checks) {
        const result = await executarUpdate(osId, { prioridade: novaPrioridade }, timelineTexto);
        if (result.offline) algumOffline = true;
      }
      
      showToast(
        algumOffline ? '📴 Prioridades salvas offline.' : '✅ Prioridades atualizadas!',
        algumOffline ? 'warn' : 'success'
      );
      document.querySelectorAll('.os-check').forEach(c => c.checked = false);
    }

    async function enviarParaTecnicos(ordens) {
      const checks = [...document.querySelectorAll('.os-check:checked')].map(c => c.value);
      if (!checks.length) { showToast('Selecione pelo menos uma O.S.', 'warn'); return; }
      
      try {
        for (const osId of checks) {
          if (navigator.onLine) {
            await addTimeline(osId, '📨 Enviada para fila dos técnicos');
          } else {
            adicionarNaFila({ tipo: 'UPDATE_OS', osId, dados: {}, timeline: '📨 Enviada para fila dos técnicos' });
          }
        }
        showToast('✅ Enviadas!', 'success');
      } catch (error) {
        showToast('❌ Erro ao enviar.', 'error');
      }
    }

    async function carregarGerenciamentoUsuarios() {
      const area = document.getElementById('gerenciarUsuariosArea');
      if (!area) return;
      
      try {
        const snapshot = await get(usersRef);
        const users = snapshot.val() || {};
        const userList = Object.entries(users).map(([key, value]) => ({ id: key, ...value }));
        
        area.innerHTML = `
          <div style="background:rgba(255,204,0,0.03);border:1px solid rgba(255,204,0,0.08);border-radius:14px;padding:18px;margin-bottom:16px;">
            <h4 style="color:#ffcc00;font-size:1.15rem;margin-bottom:14px;"><i class="fas fa-users"></i> Gerenciar Usuários</h4>
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
              <input type="text" id="novoUsuarioNome" placeholder="Nome" style="flex:1;min-width:140px;padding:12px 16px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,204,0,0.08);border-radius:12px;color:#fff;font-size:1rem;outline:none;">
              <input type="password" id="novoUsuarioSenha" placeholder="Senha" style="flex:1;min-width:120px;padding:12px 16px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,204,0,0.08);border-radius:12px;color:#fff;font-size:1rem;outline:none;">
              <select id="novoUsuarioFuncao" style="padding:12px 16px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,204,0,0.08);border-radius:12px;color:#ffcc00;font-size:1rem;outline:none;">
                <option value="Operador">Operador</option>
                <option value="Tecnico">Técnico</option>
                <option value="Gestor">Gestor</option>
              </select>
              <button class="btn-sm btn-primary" id="btnAdicionarUsuario"><i class="fas fa-plus"></i> Adicionar</button>
            </div>
            <div id="addUserMsg" style="font-size:1rem;margin-bottom:12px;"></div>
            <div class="user-list">
              ${userList.length === 0 ? '<p style="color:rgba(255,255,255,0.2);font-size:1rem;">Nenhum usuário cadastrado.</p>' : 
                userList.map(u => `
                  <div class="user-item">
                    <div>
                      <span class="user-name">${escaparHTML(u.usuario)}</span>
                      <span class="user-role">${escaparHTML(u.funcao)}</span>
                      ${u.turno ? `<span style="font-size:0.75rem;color:rgba(255,255,255,0.2);">Turno: ${escaparHTML(u.turno)}</span>` : ''}
                    </div>
                    <button class="btn-xs danger" onclick="window.removerUsuario('${u.id}')" style="color:#ff4444;border-color:rgba(255,68,68,0.1);">
                      <i class="fas fa-trash"></i>
                    </button>
                  </div>
                `).join('')
              }
            </div>
          </div>
        `;
        
        document.getElementById('btnAdicionarUsuario').addEventListener('click', async () => {
          const nome = document.getElementById('novoUsuarioNome').value.trim().toUpperCase();
          const senha = document.getElementById('novoUsuarioSenha').value.trim();
          const funcao = document.getElementById('novoUsuarioFuncao').value;
          const msg = document.getElementById('addUserMsg');
          
          if (!nome || !senha) {
            msg.innerHTML = '⚠️ Preencha nome e senha!';
            return;
          }
          
          try {
            const snapshot = await get(usersRef);
            const users = snapshot.val() || {};
            const exists = Object.values(users).some(u => u.usuario === nome);
            
            if (exists) {
              msg.innerHTML = '⚠️ Usuário já existe!';
              return;
            }
            
            const newUser = { usuario: nome, senha, funcao };
            if (funcao === 'Operador') {
              const turno = prompt('Turno (Diurno/Noturno):') || 'Diurno';
              newUser.turno = turno;
            }
            
            await push(usersRef, newUser);
            msg.innerHTML = '✅ Usuário adicionado!';
            setTimeout(() => carregarGerenciamentoUsuarios(), 500);
          } catch (error) {
            msg.innerHTML = '❌ Erro ao adicionar usuário.';
          }
        });
      } catch (error) {
        area.innerHTML = '<p style="color:#ff4444;">❌ Erro ao carregar usuários.</p>';
      }
    }

    window.removerUsuario = async function(userId) {
      if (!isMaster()) {
        showToast('Apenas o Master pode remover usuários!', 'error');
        return;
      }
      if (!confirm('Remover este usuário?')) return;
      
      try {
        await remove(ref(database, `users/${userId}`));
        showToast('✅ Usuário removido!', 'success');
        carregarGerenciamentoUsuarios();
      } catch (error) {
        showToast('❌ Erro ao remover usuário.', 'error');
      }
    };

    // ==================== RESTAURAR SESSÃO ====================
    async function restaurarSessao() {
      const sessao = recuperarSessao();
      
      if (sessao) {
        console.log('🔄 Restaurando sessão...');
        
        if (!navigator.onLine) {
          await entrarNoSistema(sessao);
          showToast('<i class="fas fa-wifi"></i> Modo offline ativado', 'warn', 3000);
          return;
        }
        
        if (sessao.isMaster) {
          await entrarNoSistema(sessao);
          return;
        }
        
        try {
          const snapshot = await get(usersRef);
          const users = snapshot.val() || {};
          const userExists = Object.values(users).some(u => u.usuario === sessao.usuario);
          
          if (userExists) {
            await entrarNoSistema(sessao);
            return;
          } else {
            removerSessao();
          }
        } catch (error) {
          await entrarNoSistema(sessao);
          return;
        }
      }
      
      homeScreen.classList.add('active');
      panelScreen.classList.remove('active');
    }

    // ==================== INICIAR ====================
    window.addEventListener('load', async () => {
      atualizarStatusConexao();
      atualizarBadgePendentesSync();
      await restaurarSessao();
    });

    console.log('✅ TOTAL - Sistema de Monitoramento');
    console.log('👨‍💻 Desenvolvido por Manuel Francisco');
    console.log('📌 TELA EXPANDIDA + MODO OFFLINE + ABAS TÉCNICAS');
    console.log('🎯 Clique em qualquer O.S. para abrir os detalhes completos');
  </script>
