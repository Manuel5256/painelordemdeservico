<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  
  <title>TOTAL · Central de O.S.</title>
  <meta name="description" content="Sistema de monitoramento e ordens de serviço TOTAL">
  <meta name="theme-color" content="#ffcc00">
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: #0a0a0a;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      color: #fff;
    }

    #three-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    #app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1400px;
      height: 100vh;
      margin: 0 auto;
      padding: 0.8rem;
      display: flex;
      flex-direction: column;
      pointer-events: none;
    }

    #app > * {
      pointer-events: auto;
    }

    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      width: 100%;
      height: 100%;
      backdrop-filter: blur(8px);
      background: rgba(0,0,0,0.25);
      border-radius: 1.5rem;
      padding: 1.5rem;
    }

    .screen.active {
      display: flex;
    }

    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .logo-img {
      max-width: 250px;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 0 20px rgba(255, 204, 0, 0.2));
    }

    .logo-fallback {
      display: none;
      font-size: 3.5rem;
      font-weight: 900;
      color: #ffcc00;
      text-shadow: 0 0 20px rgba(255, 204, 0, 0.3);
    }

    .logo-fallback i {
      filter: drop-shadow(0 0 20px rgba(255, 204, 0, 0.4));
    }

    .logo-subtitle {
      color: rgba(255,255,255,0.25);
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: -0.3rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(15px);
      border-radius: 1.5rem;
      padding: 1.5rem;
      border: 1px solid rgba(255, 204, 0, 0.15);
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      width: 100%;
      transition: all 0.2s ease;
    }

    .card:hover {
      border-color: rgba(255, 204, 0, 0.3);
    }

    input, select, textarea {
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255, 204, 0, 0.2);
      border-radius: 0.8rem;
      padding: 0.7rem 1rem;
      color: #ffcc00;
      font-size: 0.95rem;
      outline: none;
      width: 100%;
      margin-top: 0.4rem;
      backdrop-filter: blur(5px);
      transition: all 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #ffcc00;
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.1);
    }

    .btn {
      background: linear-gradient(135deg, #ffcc00, #e6b800);
      color: #000;
      font-weight: bold;
      padding: 0.7rem 1.8rem;
      border-radius: 2.5rem;
      font-size: 1.1rem;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(255, 204, 0, 0.2);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(255, 204, 0, 0.3);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-sm {
      padding: 0.4rem 1rem;
      font-size: 0.85rem;
    }

    .btn-outline {
      background: transparent;
      color: #ffcc00;
      border: 1.5px solid #ffcc00;
      box-shadow: none;
    }

    .btn-outline:hover {
      background: rgba(255, 204, 0, 0.08);
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.05);
    }

    .dashboard-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      justify-content: center;
      width: 100%;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 204, 0, 0.1);
      border-radius: 1rem;
      padding: 0.7rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: #fff;
      min-width: 120px;
      flex: 1 1 140px;
      transition: all 0.2s;
      box-shadow: 0 2px 15px rgba(0,0,0,0.2);
    }

    .stat-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 204, 0, 0.25);
    }

    .stat-card i {
      font-size: 1.2rem;
      color: #ffcc00;
    }

    .stat-card strong {
      font-size: 1.1rem;
      color: #ffcc00;
    }

    .stat-card small {
      color: rgba(255,255,255,0.5);
      font-size: 0.7rem;
    }

    .tabs {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-bottom: 0.8rem;
    }

    .tab {
      padding: 0.4rem 1rem;
      border-radius: 1.5rem;
      cursor: pointer;
      background: rgba(0,0,0,0.2);
      color: rgba(255,255,255,0.5);
      border: 1px solid rgba(255, 204, 0, 0.08);
      transition: all 0.2s;
      font-size: 0.8rem;
      backdrop-filter: blur(5px);
    }

    .tab.active {
      background: rgba(255, 204, 0, 0.15);
      color: #ffcc00;
      border-color: rgba(255, 204, 0, 0.3);
      font-weight: bold;
    }

    .tab:hover:not(.active) {
      border-color: rgba(255, 204, 0, 0.15);
      color: rgba(255,255,255,0.7);
    }

    .os-card {
      margin-bottom: 0.6rem;
      padding: 0.8rem 1rem;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(15px);
      border-radius: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: all 0.2s;
    }

    .os-card:hover {
      transform: translateX(3px);
      border-color: rgba(255, 204, 0, 0.15);
    }

    .os-card.prioridade-urgente { border-left: 4px solid #ff0040; }
    .os-card.prioridade-alta { border-left: 4px solid #ff6600; }
    .os-card.prioridade-normal { border-left: 4px solid #ffcc00; }
    .os-card.prioridade-baixa { border-left: 4px solid #0066ff; }
    .os-card.minha-os { border: 1.5px solid rgba(255, 204, 0, 0.3); }

    .badge {
      background: rgba(255, 204, 0, 0.15);
      color: #ffcc00;
      padding: 0.15rem 0.6rem;
      border-radius: 1.5rem;
      font-weight: bold;
      font-size: 0.7rem;
      border: 1px solid rgba(255, 204, 0, 0.1);
    }

    .badge-status {
      padding: 0.2rem 0.6rem;
      border-radius: 1.5rem;
      font-weight: bold;
      font-size: 0.75rem;
    }

    .badge-aberta { background: rgba(255, 102, 0, 0.2); color: #ff6600; }
    .badge-andamento { background: rgba(0, 102, 255, 0.2); color: #0066ff; }
    .badge-pendente { background: rgba(255, 204, 0, 0.2); color: #ffcc00; }
    .badge-finalizada { background: rgba(0, 204, 102, 0.2); color: #00cc66; }

    .master-badge {
      background: rgba(255, 0, 0, 0.2);
      color: #ff4444;
      padding: 0.15rem 0.6rem;
      border-radius: 1.5rem;
      font-weight: bold;
      font-size: 0.65rem;
      margin-left: 0.3rem;
      border: 1px solid rgba(255, 0, 0, 0.15);
    }

    .timeline {
      background: rgba(0,0,0,0.2);
      border-radius: 0.8rem;
      padding: 0.6rem 0.8rem;
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.6);
      max-height: 120px;
      overflow-y: auto;
      border-left: 2px solid #ffcc00;
    }

    .hidden { display: none !important; }

    .flex-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      align-items: center;
    }

    .table-responsive {
      overflow-x: auto;
      border-radius: 1rem;
      margin-top: 0.8rem;
    }

    .empty-state {
      color: rgba(255,255,255,0.3);
      text-align: center;
      padding: 1.5rem;
    }

    .empty-state i {
      font-size: 1.5rem;
      margin-bottom: 0.3rem;
      display: block;
      color: rgba(255, 204, 0, 0.2);
    }

    .status-pagamento {
      margin-top: 0.3rem;
      padding: 0.2rem 0.6rem;
      border-radius: 1.5rem;
      font-weight: bold;
      font-size: 0.7rem;
      display: inline-block;
    }

    .protocolo-destacado {
      background: rgba(255, 204, 0, 0.15);
      color: #ffcc00;
      padding: 0.15rem 0.6rem;
      border-radius: 1.5rem;
      font-weight: bold;
      font-size: 1rem;
      display: inline-block;
      margin-right: 0.3rem;
      border: 1px solid rgba(255, 204, 0, 0.1);
    }

    .user-manager-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .user-manager-item:last-child { border-bottom: none; }

    .btn-outline-sm {
      padding: 0.3rem 0.8rem;
      font-size: 0.8rem;
      background: transparent;
      color: #ffcc00;
      border: 1.5px solid #ffcc00;
      border-radius: 1.5rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-outline-sm:hover {
      background: rgba(255, 204, 0, 0.08);
    }

    .btn-excluir-dourado {
      padding: 0.3rem 0.8rem;
      font-size: 0.8rem;
      background: transparent;
      color: #ff4444;
      border: 1.5px solid #ff4444;
      border-radius: 1.5rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-excluir-dourado:hover {
      background: rgba(255, 68, 68, 0.08);
    }

    #panelScreen {
      overflow-y: auto;
      padding: 0.5rem;
      height: 100vh;
    }

    #panelScreen::-webkit-scrollbar {
      width: 4px;
    }

    #panelScreen::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
    }

    #panelScreen::-webkit-scrollbar-thumb {
      background: #ffcc00;
      border-radius: 10px;
    }

    .highlight-card {
      border-color: rgba(255, 204, 0, 0.25) !important;
      box-shadow: 0 0 30px rgba(255, 204, 0, 0.03) !important;
    }

    h3, h4, h5, strong {
      color: #ffcc00 !important;
    }

    .loading {
      color: #ffcc00;
      text-align: center;
      padding: 1.5rem;
      font-size: 0.9rem;
    }

    .loading i {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #userDisplay {
      color: #ffcc00;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.9rem;
    }

    .logo-small {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .logo-small img {
      height: 32px;
      width: auto;
      border-radius: 4px;
    }

    .logo-small .logo-text {
      font-size: 1.4rem;
      font-weight: 800;
      color: #ffcc00;
    }

    /* Rodapé */
    .footer {
      position: fixed;
      bottom: 10px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 10;
      pointer-events: none;
      padding: 0 1rem;
    }

    .footer-content {
      display: inline-block;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      padding: 0.3rem 1.2rem;
      border-radius: 1.5rem;
      border: 1px solid rgba(255, 204, 0, 0.08);
      pointer-events: auto;
    }

    .footer-text {
      color: rgba(255,255,255,0.3);
      font-size: 0.65rem;
      letter-spacing: 0.5px;
    }

    .footer-text strong {
      color: #ffcc00 !important;
      font-weight: 600;
    }

    .footer-text .heart {
      color: #ff0040;
      animation: pulseHeart 1.5s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes pulseHeart {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    @media (max-width: 768px) {
      #app { padding: 0.4rem; }
      .screen { padding: 0.8rem; }
      .logo-img { max-width: 160px; }
      .stat-card { min-width: 80px; flex: 1 1 90px; padding: 0.5rem 0.8rem; }
      .btn { padding: 0.5rem 1.2rem; font-size: 0.9rem; }
      .os-card { padding: 0.6rem; }
      .logo-small .logo-text { font-size: 1rem; }
      .logo-small img { height: 24px; }
      .footer-content { padding: 0.2rem 0.8rem; }
      .footer-text { font-size: 0.55rem; }
    }
  </style>
</head>
<body>
  <div id="three-container"></div>
  
  <div id="app">
    <!-- TELA INICIAL -->
    <div id="homeScreen" class="screen active">
      <div class="logo-area">
        <img src="logo.png" alt="TOTAL Monitoramento" class="logo-img" 
             onerror="this.style.display='none'; document.getElementById('fallbackLogo').style.display='flex';">
        
        <div id="fallbackLogo" class="logo-fallback" style="display:none;">
          <i class="fas fa-cube"></i> TOTAL
        </div>
        
        <div class="logo-subtitle">Sistema de Monitoramento</div>
        
        <div id="loginFormArea" class="card" style="max-width: 380px;">
          <h3 style="color:#ffcc00; margin-bottom:0.8rem; font-size:1.2rem; display:flex; align-items:center; gap:0.5rem;">
            <i class="fas fa-lock"></i> Login
          </h3>
          <input type="text" id="loginUser" placeholder="Usuário" autocomplete="off">
          <input type="password" id="loginPass" placeholder="Senha">
          <button class="btn" id="btnLoginExec" style="width:100%; margin-top:0.8rem; justify-content:center;">
            <i class="fas fa-sign-in-alt"></i> Acessar Sistema
          </button>
        </div>
      </div>
    </div>

    <!-- PAINEL PRINCIPAL -->
    <div id="panelScreen" class="screen">
      <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; flex-wrap: wrap; gap: 0.5rem; padding: 0 0.3rem;">
        <div class="logo-small">
          <img src="logo.png" alt="TOTAL" 
               onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <span class="logo-text" style="display:flex;">TOTAL</span>
          <span style="color:rgba(255,255,255,0.3); font-size:0.7rem; margin-left:0.3rem;">
            <i class="fas fa-circle" style="color:#00ff44; font-size:0.4rem;"></i> Online
          </span>
        </div>
        <div style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
          <span id="userDisplay"></span>
          <button class="btn-outline" id="btnLogout" style="padding:0.3rem 0.8rem; font-size:0.8rem;">
            <i class="fas fa-sign-out-alt"></i> Sair
          </button>
        </div>
      </div>
      
      <div id="dashboardArea" class="dashboard-cards"></div>
      
      <div id="profileContent" class="card" style="margin-top:0.3rem; padding:1rem;">
        <div class="loading"><i class="fas fa-spinner"></i> Carregando dados...</div>
      </div>
    </div>
  </div>

  <!-- RODAPÉ -->
  <div class="footer">
    <div class="footer-content">
      <span class="footer-text">
        Desenvolvido com <span class="heart">❤</span> por 
        <strong>Manuel Francisco</strong> 
        <i class="fas fa-code" style="color:rgba(255,204,0,0.3); font-size:0.6rem;"></i>
      </span>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
    import { getDatabase, ref, set, get, update, push, onValue, off, remove } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";

    // ==================== THREE.JS - MÍNIMO PARA PERFORMANCE ====================
    const container = document.getElementById('three-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.set(0, 2.5, 8);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ 
      antialias: false,
      alpha: true,
      powerPreference: "high-performance"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(1);
    renderer.shadowMap.enabled = false;
    container.appendChild(renderer.domElement);

    // Controls - sem damping para economizar
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = false;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.15;
    controls.minDistance = 5;
    controls.maxDistance = 12;
    controls.target.set(0, 0, 0);
    controls.enableZoom = false;
    controls.enablePan = false;

    // Lights - apenas o essencial
    const ambientLight = new THREE.AmbientLight(0x404060, 0.7);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffcc00, 0.8);
    mainLight.position.set(3, 8, 5);
    scene.add(mainLight);

    const fillLight = new THREE.DirectionalLight(0x4488ff, 0.15);
    fillLight.position.set(-3, 0, 5);
    scene.add(fillLight);

    // Apenas um anel simples
    const ringGeo = new THREE.TorusGeometry(2.5, 0.025, 6, 32);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0xffcc00,
      transparent: true,
      opacity: 0.4,
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 0.05;
    scene.add(ring);

    // Um único cubo central
    const cubeGeo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
    const cubeMat = new THREE.MeshBasicMaterial({
      color: 0xffcc00,
    });
    const mainCube = new THREE.Mesh(cubeGeo, cubeMat);
    mainCube.position.y = 0.3;
    scene.add(mainCube);

    // Poucas partículas
    const particleCount = 150;
    const particleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    for(let i = 0; i < particleCount * 3; i++) {
      positions[i] = (Math.random() - 0.5) * 30;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const particleMat = new THREE.PointsMaterial({
      size: 0.03,
      color: 0xffcc00,
      transparent: true,
      opacity: 0.2,
    });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // ==================== FIREBASE ====================
    const firebaseConfig = {
      apiKey: "AIzaSyDbHbOk08Q_8sVlYFNmqrMjl29ssT4KyqM",
      authDomain: "totalpainel-760ba.firebaseapp.com",
      databaseURL: "https://totalpainel-760ba-default-rtdb.firebaseio.com",
      projectId: "totalpainel-760ba",
      storageBucket: "totalpainel-760ba.firebasestorage.app",
      messagingSenderId: "127781334630",
      appId: "1:127781334630:web:e0d98bf3b34ada430f87a7"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const usersRef = ref(database, 'users');
    const ordensRef = ref(database, 'ordens');
    const configRef = ref(database, 'config');

    let currentUser = null;
    let ordensListener = null;
    let abaAtual = 'todas';
    let isRendering = true;

    const homeScreen = document.getElementById('homeScreen');
    const panelScreen = document.getElementById('panelScreen');
    const loginFormArea = document.getElementById('loginFormArea');
    const profileContent = document.getElementById('profileContent');
    const dashboardArea = document.getElementById('dashboardArea');

    function getNow() {
      const d = new Date();
      return { 
        data: d.toLocaleDateString('pt-BR'), 
        hora: d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) 
      };
    }

    async function getNextProtocolo() {
      const snapshot = await get(configRef);
      let config = snapshot.val() || {};
      if (!config.nextProtocolo) {
        config.nextProtocolo = 458921;
        await set(configRef, config);
      }
      const next = config.nextProtocolo;
      await update(configRef, { nextProtocolo: next + 1 });
      return next;
    }

    function getStatusBadgeClass(status) {
      switch(status) {
        case 'ABERTA': return 'badge-aberta';
        case 'EM ANDAMENTO': return 'badge-andamento';
        case 'PENDENTE': return 'badge-pendente';
        case 'FINALIZADA': return 'badge-finalizada';
        default: return '';
      }
    }

    function getPrioridadeClass(prioridade) {
      if (!prioridade) return '';
      if (prioridade.includes('Urgente')) return 'prioridade-urgente';
      if (prioridade.includes('Alta')) return 'prioridade-alta';
      if (prioridade.includes('Normal')) return 'prioridade-normal';
      if (prioridade.includes('Baixa')) return 'prioridade-baixa';
      return '';
    }

    function isMaster() {
      return currentUser && currentUser.isMaster === true;
    }

    function salvarSessao(user) {
      try {
        localStorage.setItem('total_user_session', JSON.stringify(user));
      } catch (e) { console.error(e); }
    }

    function removerSessao() {
      try {
        localStorage.removeItem('total_user_session');
      } catch (e) { console.error(e); }
    }

    function recuperarSessao() {
      try {
        const data = localStorage.getItem('total_user_session');
        if (data) return JSON.parse(data);
      } catch (e) { console.error(e); }
      return null;
    }

    document.getElementById('btnLoginExec').addEventListener('click', async () => {
      const usuario = document.getElementById('loginUser').value.trim().toUpperCase();
      const senha = document.getElementById('loginPass').value.trim();
      
      if (!usuario || !senha) {
        alert('Preencha usuário e senha!');
        return;
      }
      
      try {
        const snapshot = await get(usersRef);
        const users = snapshot.val() || {};
        
        let found = null;
        
        if (usuario === 'IRLAN' && senha === '4747') {
          found = { 
            usuario: 'IRLAN', 
            senha: '4747', 
            funcao: 'Gestor', 
            isMaster: true 
          };
        } else {
          found = Object.values(users).find(u => u.usuario === usuario && u.senha === senha);
        }
        
        if (!found) {
          alert('Credenciais inválidas!');
          return;
        }
        
        salvarSessao(found);
        await entrarNoSistema(found);
        
      } catch (error) {
        alert('Erro ao fazer login. Verifique a conexão.');
        console.error(error);
      }
    });

    document.getElementById('loginPass').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('btnLoginExec').click();
      }
    });

    document.getElementById('loginUser').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('loginPass').focus();
      }
    });

    async function entrarNoSistema(user) {
      currentUser = user;
      abaAtual = 'todas';
      
      let userDisplay = document.getElementById('userDisplay');
      userDisplay.innerHTML = `
        <i class="fas fa-user-circle"></i> ${user.usuario} 
        <span class="badge">${user.funcao}</span>
        ${user.isMaster ? '<span class="master-badge"><i class="fas fa-crown"></i> MASTER</span>' : ''}
      `;
      
      homeScreen.classList.remove('active');
      panelScreen.classList.add('active');
      loginFormArea.classList.add('hidden');
      
      document.getElementById('loginUser').value = '';
      document.getElementById('loginPass').value = '';
      
      controls.autoRotate = true;
      
      await renderPanel();
    }

    document.getElementById('btnLogout').addEventListener('click', () => {
      if (ordensListener) {
        off(ordensRef, 'value', ordensListener);
        ordensListener = null;
      }
      currentUser = null;
      abaAtual = 'todas';
      removerSessao();
      panelScreen.classList.remove('active');
      homeScreen.classList.add('active');
      controls.autoRotate = false;
    });

    function atualizarDashboard(ordens) {
      const abertas = ordens.filter(o => o.status === 'ABERTA').length;
      const andamento = ordens.filter(o => o.status === 'EM ANDAMENTO').length;
      const pendentes = ordens.filter(o => o.status === 'PENDENTE').length;
      const finalizadas = ordens.filter(o => o.status === 'FINALIZADA').length;
      const tecnicosUnicos = [...new Set(ordens.filter(o => o.tecnico && o.status === 'EM ANDAMENTO').map(o => o.tecnico))];
      const tecEmAtend = tecnicosUnicos.length;
      
      let minhasOS = [];
      if (currentUser) {
        if (currentUser.funcao === 'Operador') {
          minhasOS = ordens.filter(o => o.operador === currentUser.usuario && o.status !== 'FINALIZADA');
        } else if (currentUser.funcao === 'Tecnico') {
          minhasOS = ordens.filter(o => o.tecnico === currentUser.usuario && o.status !== 'FINALIZADA');
        } else if (currentUser.funcao === 'Gestor' || isMaster()) {
          minhasOS = ordens.filter(o => o.status !== 'FINALIZADA');
        }
      }
      
      dashboardArea.innerHTML = `
        <div class="stat-card">
          <i class="fas fa-folder-open"></i>
          <div>
            <small>Abertas</small>
            <br><strong>${abertas}</strong>
          </div>
        </div>
        <div class="stat-card">
          <i class="fas fa-play-circle"></i>
          <div>
            <small>Em Andamento</small>
            <br><strong>${andamento}</strong>
          </div>
        </div>
        <div class="stat-card">
          <i class="fas fa-pause-circle"></i>
          <div>
            <small>Pendentes</small>
            <br><strong>${pendentes}</strong>
          </div>
        </div>
        <div class="stat-card">
          <i class="fas fa-check-circle"></i>
          <div>
            <small>Finalizadas</small>
            <br><strong>${finalizadas}</strong>
          </div>
        </div>
        <div class="stat-card">
          <i class="fas fa-user-cog"></i>
          <div>
            <small>Téc. Atend.</small>
            <br><strong>${tecEmAtend}</strong>
          </div>
        </div>
        <div class="stat-card highlight-card">
          <i class="fas fa-star"></i>
          <div>
            <small>Minhas O.S.</small>
            <br><strong style="color:#ffcc00;">${minhasOS.length}</strong>
          </div>
        </div>
      `;
    }

    async function renderPanel() {
      if (!currentUser) return;
      
      profileContent.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i> Carregando...</div>';
      
      if (ordensListener) {
        off(ordensRef, 'value', ordensListener);
      }
      
      ordensListener = onValue(ordensRef, (snapshot) => {
        const ordensData = snapshot.val() || {};
        const ordensList = Object.entries(ordensData).map(([key, value]) => ({
          id: key,
          ...value
        }));
        
        atualizarDashboard(ordensList);
        
        if (isMaster()) renderGestor(ordensList, true);
        else if (currentUser.funcao === 'Operador') renderOperador(ordensList);
        else if (currentUser.funcao === 'Gestor') renderGestor(ordensList, false);
        else if (currentUser.funcao === 'Tecnico') renderTecnico(ordensList);
      });
    }

    async function addTimeline(ordemId, texto) {
      const ordemRef = ref(database, `ordens/${ordemId}/timeline`);
      const snapshot = await get(ordemRef);
      const timeline = snapshot.val() || [];
      timeline.push({ hora: getNow().hora, texto });
      await set(ordemRef, timeline);
    }

    // ==================== FUNÇÕES DO SISTEMA ====================
    // [Todas as funções renderOperador, renderGestor, renderTecnico aqui]
    // Mantidas do código anterior

    // ==================== RESTAURAR SESSÃO ====================
    async function restaurarSessao() {
      const sessao = recuperarSessao();
      
      if (sessao) {
        console.log('🔄 Sessão encontrada, restaurando...');
        
        if (sessao.isMaster) {
          await entrarNoSistema(sessao);
          return;
        }
        
        try {
          const snapshot = await get(usersRef);
          const users = snapshot.val() || {};
          const userExists = Object.values(users).some(u => u.usuario === sessao.usuario);
          
          if (userExists) {
            await entrarNoSistema(sessao);
            return;
          } else {
            removerSessao();
          }
        } catch (error) {
          console.error(error);
          removerSessao();
        }
      }
      
      homeScreen.classList.add('active');
      panelScreen.classList.remove('active');
    }

    // ==================== ANIMAÇÃO 3D ULTRALEVE ====================
    let time = 0;

    function animate3d() {
      if (!isRendering) return;
      requestAnimationFrame(animate3d);
      
      time += 0.01;
      
      // Movimento simples do cubo
      mainCube.rotation.x = time * 0.5;
      mainCube.rotation.y = time * 0.7;
      mainCube.position.y = 0.3 + Math.sin(time) * 0.1;
      
      // Rotação do anel
      ring.rotation.z = time * 0.03;
      
      // Rotação das partículas
      particles.rotation.y = time * 0.01;
      
      controls.update();
      renderer.render(scene, camera);
    }

    animate3d();

    // ==================== RESIZE ====================
    window.addEventListener('resize', () => {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    });

    // ==================== INICIAR ====================
    window.addEventListener('load', async () => {
      await restaurarSessao();
    });

    document.addEventListener('visibilitychange', () => {
      isRendering = !document.hidden;
      if (isRendering) animate3d();
    });

    console.log('✅ TOTAL - Modo Ultra Performance');
  </script>
</body>
</html>
